        <span class="head"><span class="eye l"></span><span class="eye r"></span><span class="blush l"></span><span class="blush r"></span><span class="mouth"></span>${L.acc === 'glasses' ? '<span class="glasses"></span>' : critic ? '<span class="glasses shades"></span>' : ''}</span>
        ${L.style !== 3 && !hat ? '<span class="cap"></span>' : ''}
        ${L.acc === 'beanie' ? '<span class="beanie"></span>' : ''}
        ${critic ? '<span class="beret"></span>' : ''}
        ${L.acc === 'headphones' ? '<span class="phones"></span>' : ''}
        <span class="body">${critic ? '<span class="scarf"></span>' : ''}</span>
      </span>`;
  }

  /* ---------- Daily challenge ---------- */
  function makeTask(d, c) {
    const expected = Math.floor(c.dur / c.spawn);
    const drinks = unlockedDrinks(d).filter(x => x.name !== 'Espresso' && !x.sig);
    const serveN = Math.max(5, Math.round(expected * .6));
    const comboN = Math.min(8, 3 + Math.floor(d / 4));
    const pick = rnd(drinks), pickN = drinks.length > 8 ? 2 : 3;
    const opts = [
      { text: `Serve ${serveN} customers`, n: serveN, prog: s => s.stats.served },
      { text: `Reach a ×${comboN} combo`, n: comboN, prog: s => s.bestStreak },
      { text: 'No walkouts all shift', clean: s => s.stats.missed },
      { text: 'Hand over zero wrong orders', clean: s => s.stats.wrong },
      { text: `Serve ${pickN} ${plural(pick.name)}`, n: pickN, prog: s => s.stats.byDrink[pick.name] || 0 },
    ];
    if (d >= OVEN_DAY) opts.push({ text: 'Serve 4 pastries', n: 4, prog: s => s.stats.pastries });
    if (d >= REG_DAY) opts.push({ text: 'Serve 2 regulars', n: 2, prog: s => s.stats.regulars });
    const t = rnd(opts); t.reward = 10 + 2 * d;
    return t;
  }
  function taskStatus(t) {
    if (t.n) { const p = Math.min(t.n, t.prog(S)); return { done: p >= t.n, frac: p / t.n, label: `${p} / ${t.n}` }; }
    const v = t.clean(S);
    return { done: v === 0, frac: v === 0 ? 1 : 0, label: v === 0 ? 'So far so good' : 'Missed it this time' };
  }

  /* ---------- State ---------- */
  let S = null;
  let stationBusyEls = {};
  function freshState(d) {
    const c = cfg(d);
    const specials = unlockedDrinks(d).filter(x => x.name !== 'Espresso' && !x.sig);
    const rs = c.dur * (0.3 + Math.random() * 0.3);
    return {
      day: d, c, t: 0, money: 0, streak: 0, bestStreak: 0,
      stats: { served: 0, missed: 0, wrong: 0, pastries: 0, regulars: 0, critics: 0, sig: 0, byDrink: {} },
      spots: [null, null, null, null],
      cups: Array.from({ length: own('cup3') ? 3 : 2 }, () => mkCup()), cupSel: 0, sel: { k: 'cup', i: 0 },
      oven: d >= OVEN_DAY ? Array(own('oven3') ? 3 : 2).fill(null) : [],
      busy: { machine: 0, steamer: 0 }, nextSpawn: 1, running: false, paused: false,
      rush: d >= RUSH_DAY ? { start: rs, end: rs + 20 } : null, inRush: false,
      special: d >= SPECIAL_DAY && specials.length ? rnd(specials).name : null,
      task: d >= TASK_DAY ? makeTask(d, c) : null,
    };
  }

  /* ---------- Day setup ---------- */
  function startDay(d) {
    initAudio();
    document.querySelectorAll('.cust').forEach(e => e.remove());
    S = freshState(d);
    buildStations(); renderMenu(); renderCups(); renderOven(); renderHUD();
    document.querySelectorAll('.pat').forEach(p => p.className = 'pat');
    $('#rush').hidden = true;
    const P = pastries();
    const fresh = unlockedDrinks(d).filter(x => x.day === d && !x.sig).length + unlockedPastries(d).filter(k => P[k].day === d && !P[k].sig).length;
    const secs = S.c.dur;
    showCard(`
      <h2>Day ${d} menu</h2>
      <p>${d === 1 ? 'Learn these three, then open up.' : fresh ? `${fresh} new item${fresh > 1 ? 's' : ''} today, marked in yellow.` : 'Same menu, busier crowd.'}
        Goal: <b>${money(S.c.goal)}</b> in <b>${secs} seconds</b>.</p>
      ${diffPicker()}
      ${NEWS[d] ? `<div class="unlock"><b>New: ${NEWS[d].title}.</b> ${NEWS[d].text}</div>` : ''}
      ${S.task ? `<div class="unlock goal"><b>Challenge:</b> ${S.task.text}. Bonus <b>${money(S.task.reward)}</b> to savings.</div>` : ''}
      ${S.special ? `<p>Today's special: <b class="spc">★ ${esc(S.special)}</b> pays 50% more.</p>` : ''}
      ${recipesHTML(d, d >= 3)}
      <div class="btnrow"><button class="big" id="openBtn" type="button">Open the café</button></div>
      <p class="small">Tickets spell out the recipe for new drinks during their first two days. Tap Hints up top to show it on every ticket. The Menu button pauses the clock and shows every recipe.</p>`, 'chalk');
    wireDiff(() => startDay(d));
    $('#openBtn').onclick = () => {
      S.running = true; last = performance.now();
      $('#overlay').hidden = true; sfx.bell();
      if (d === 1 && (!SAVE.tutDone || tutForce)) startTut();
      tutForce = false;
    };
  }

  function recipesHTML(d, collapse = false) {
    const P = pastries();
    const isNew = x => x.day === d && d > 1 && !x.sig;
    const drinkLi = x => `<li class="${isNew(x) ? 'isnew' : ''}">
        <span class="rname">${esc(x.name)}${isNew(x) ? '<span class="newtag">New</span>' : ''}${x.sig ? '<span class="newtag sig">Yours</span>' : ''}${S && x.name === S.special ? ' <span class="spc">★ special</span>' : ''}</span>
        <span class="rsteps">${[x.cup, ...x.items].map(k => `<span class="rstep"><span class="dot" style="--c:${ING[k].c}"></span>${ING[k].label}</span>`).join('')}</span>
      </li>`;
    const pastryLi = k => `<li class="${isNew(P[k]) ? 'isnew' : ''}">
        <span class="rname">${pastryHTML(P[k].look, 'mini')} ${esc(P[k].label)}${isNew(P[k]) ? '<span class="newtag">New</span>' : ''}${P[k].sig ? '<span class="newtag sig">Yours</span>' : ''}</span>
        <span class="rsteps"><span class="rstep">Pastry case</span><span class="rstep">Oven ${warmTime()}s</span><span class="rstep">Serve</span></span>
      </li>`;
    const mods = [];
    if (d >= OAT_DAY) mods.push(`<li class="rmod"><b>Oat</b> tag: use Oat milk instead of Milk</li>`);
    if (d >= SHOT_DAY) mods.push(`<li class="rmod"><b>+Shot</b> tag: add one more Espresso</li>`);
    const drinks = unlockedDrinks(d), pk = unlockedPastries(d);
    const all = drinks.map(drinkLi).join('') + pk.map(pastryLi).join('') + mods.join('');
    if (!collapse) return `<ul class="recipes">${all}</ul>`;
    const fresh = drinks.filter(isNew).map(drinkLi).join('') + pk.filter(k => isNew(P[k])).map(pastryLi).join('');
    return `${fresh ? `<ul class="recipes">${fresh}</ul>` : ''}<details class="fullmenu"><summary>Full menu (${drinks.length + pk.length} items)</summary><ul class="recipes">${all}</ul></details>`;
  }

  function buildStations() {
    const wrap = $('#stations'); wrap.innerHTML = ''; stationBusyEls = {};
    STATION_ORDER.forEach(k => {
      const ing = ING[k];
      if (ing.day > S.day + 1) return; // tease only tomorrow's unlock
      const locked = ing.day > S.day;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'station' + (ing.cup ? ' cupbtn' : ''); b.dataset.k = k;
      b.disabled = locked;
      const sub = locked ? `Day ${ing.day}` : ing.station ? `${stationTime(k)}s${cap(ing.station) > 1 ? ' · ×2' : ''}` : ing.cup ? 'grab' : 'add';
      b.innerHTML = `<span class="ic${ing.cup ? ' sq' : ''}" style="--c:${ing.c}"></span><span class="lbl-f">${ing.label}</span><span class="lbl-m">${ing.m || ing.label}</span><span class="t">${sub}</span><span class="busy"></span><span class="kbd">${KEYS[k]}</span>`;
      b.addEventListener('click', () => add(k));
      wrap.appendChild(b);
      stationBusyEls[k] = b.querySelector('.busy');
    });
    const d2 = document.createElement('button');
    d2.type = 'button'; d2.className = 'station dumpbtn';
    d2.innerHTML = '<span class="ic dumpic"></span>Dump<span class="t">selected</span>';
    d2.addEventListener('click', dump);
    wrap.appendChild(d2);
    const cs = $('#case'), P = pastries();
    const keys = Object.keys(P).filter(k => P[k].day <= S.day + 1);
    cs.hidden = !keys.length;
    cs.innerHTML = keys.length ? '<span class="cl">Pastry case · tap one to warm it in the oven</span>' : '';
    keys.forEach(k => {
      const locked = P[k].day > S.day;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'station' + (P[k].sig ? ' sig' : ''); b.disabled = locked;
      b.innerHTML = `${pastryHTML(P[k].look, 'mini')}${esc(P[k].short)}<span class="t">${locked ? `Day ${P[k].day}` : P[k].sig ? 'your signature' : `warm ${warmTime()}s`}</span><span class="kbd">${PKEYS[k] || ''}</span>`;
      b.addEventListener('click', () => bake(k));
      cs.appendChild(b);
    });
    $('#oven').hidden = !S.oven.length;
  }

  function renderMenu() {
    const ul = $('#menu'); ul.innerHTML = '';
    unlockedDrinks(S.day).forEach(d => {
      const li = document.createElement('li');
      const rec = [ING[d.cup].label.replace(' cup', '')].concat(d.items.map(i => ING[i].label)).join(' + ');
      const tag = d.sig ? '<span class="new">yours!</span>' : d.day === S.day && S.day > 1 ? '<span class="new">new!</span>' : '';
      const star = d.name === S.special ? '★ ' : '';
      li.innerHTML = `<div class="row"><span>${star}${esc(d.name)}${tag}</span><span class="price">${d.price.toFixed(2)}</span></div><div class="rec">${rec}</div>`;
      ul.appendChild(li);
    });
    const P = pastries(), pk = unlockedPastries(S.day);
    $('#pastryBoard').innerHTML = pk.length ? `<h3>From the oven</h3><ul>${pk.map(k => `<li><div class="row"><span>${esc(P[k].label)}${P[k].day === S.day && !P[k].sig ? '<span class="new">new!</span>' : ''}</span><span class="price">${P[k].price.toFixed(2)}</span></div></li>`).join('')}</ul>` : '';
    const notes = [];
    if (S.day >= OAT_DAY) notes.push('“Oat” means swap Milk for Oat milk.');
    if (S.day >= SHOT_DAY) notes.push('“+Shot” means one more Espresso.');
    notes.push('Build it, then tap the customer to hand it over.');
    $('#boardfoot').innerHTML = notes.join('<br>');
  }

  /* ---------- Customers ---------- */
  function makeOrder() {
    const d = S.day, drinks = unlockedDrinks(d), pk = unlockedPastries(d), P = pastries();
    const here = S.spots.filter(Boolean).map(c => c.o.who);
    const regs = d >= REG_DAY ? REGULARS.filter(g => !here.includes(g.name) && drinks.some(x => x.name === g.fav)) : [];
    const drinkW = x => (x.day === d && d > 1 ? 2 : 1) + (x.sig ? 2 : 0) + (x.name === S.special ? 1 : 0);
    const pastryW = k => (P[k].day === d ? 2 : 1) + (P[k].sig ? 2 : 0);
    let kind = 'normal', who = null, look = randomLook(), drink = null, pastry = null;

    if (regs.length && Math.random() < .14) {
      const g = rnd(regs); kind = 'regular'; who = g.name; look = { ...g.look };
      drink = drinks.find(x => x.name === g.fav);
      if (g.pastry && pk.includes(g.pastry)) pastry = g.pastry;
    } else if (d >= KID_DAY && Math.random() < .1) {
      kind = 'kid'; look.kid = true; look.acc = 'none';
      drink = drinks.find(x => x.name === 'Hot Chocolate');
      if (pk.includes('cookie') && Math.random() < .5) pastry = 'cookie';
    } else {
      if (d >= CRITIC_DAY && Math.random() < .07) { kind = 'critic'; look.acc = 'critic'; }
      const rr = Math.random();
      if (pk.length && rr < .12) pastry = pickWeighted(pk, pastryW);
      else {
        drink = pickWeighted(drinks, drinkW);
        if (pk.length && rr < .42) pastry = pickWeighted(pk, pastryW);
      }
    }
    if (!drink && !pastry) drink = pickWeighted(drinks, drinkW);

    let dr = null;
    if (drink) {
      dr = { name: drink.name, day: drink.day, cup: drink.cup, items: [...drink.items], price: drink.price, mods: [], sig: !!drink.sig, special: drink.name === S.special };
      if (kind === 'normal' || kind === 'critic') {
        if (d >= OAT_DAY && dr.items.includes('milk') && Math.random() < .3) {
          dr.items[dr.items.indexOf('milk')] = 'oat'; dr.mods.push('Oat'); dr.price += .75;
        }
        if (d >= SHOT_DAY && dr.items.includes('shot') && Math.random() < .2) { dr.items.push('shot'); dr.mods.push('+Shot'); dr.price += .75; }
      }
    }
    return { kind, who, look, drink: dr, pastry };
  }

  function spawn(forced = null, at = null) {
    const free = S.spots.map((c, i) => c ? -1 : i).filter(i => i >= 0);
    if (!free.length) return false;
    const i = at != null && !S.spots[at] ? at : rnd(free), o = forced || makeOrder(), P = pastries();
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'cust' + (showsRecipe(o) ? '' : ' nochips') + (o.kind === 'critic' ? ' critic' : '');
    const parts = [o.drink && `${o.drink.mods.join(' ')} ${o.drink.name}`, o.pastry && P[o.pastry].label].filter(Boolean).join(' and ');
    el.setAttribute('aria-label', `${o.who || (o.kind === 'critic' ? 'Food critic' : 'Customer')} wants ${parts}. Tap to serve.`);
    el.style.cssText = `--skin:${o.look.skin};--hair:${o.look.hair};--shirt:${o.look.shirt}`;
    const tag = o.kind === 'regular' ? `${esc(o.who)} ${'♥'.repeat(hearts(o.who))}` : o.kind === 'critic' ? 'Food critic ★' : '';
    let dpart = '';
    if (o.drink) {
      const mods = o.drink.mods.length ? `<span class="mods">${o.drink.mods.map(m => `<span class="mod">${m}</span>`).join('')}</span>` : '';
      const chips = `<span class="chips">${[o.drink.cup, ...o.drink.items].map(k => `<span class="chip" style="--c:${ING[k].c};--t:${ING[k].dark ? '#fff' : 'var(--ink)'}">${ING[k].short}</span>`).join('')}</span>`;
      dpart = `<span class="part d">${esc(o.drink.name)}${o.drink.special ? ' <span class="spc">★</span>' : ''}${mods}${chips}</span>`;
    }
    const ppart = o.pastry ? `<span class="part p${o.drink ? '' : ' solo'}">${o.drink ? '+ ' : ''}${esc(P[o.pastry].label)}</span>` : '';
    el.innerHTML = `<span class="ticket">${tag ? `<span class="who">${tag}</span>` : ''}${dpart}${ppart}</span>${personHTML(o.look)}`;
    el.addEventListener('click', () => serve(i));
    document.querySelectorAll('.spot')[i].appendChild(el);
    const steps = (o.drink ? 1 + o.drink.items.length : 0) + (o.pastry ? 3 : 0);
    const mult = patienceMult() * (o.kind === 'critic' ? .7 : o.kind === 'regular' ? 1.2 : 1);
    S.spots[i] = { o, el, p: 1, drinkDone: false, pastryDone: false, patience: (S.c.patience + S.c.perStep * steps) * mult * (0.9 + Math.random() * .25) };
    document.querySelectorAll('.pat')[i].classList.add('on');
    sfx.click();
    return true;
  }

  function leave(i) {
    const c = S.spots[i]; if (!c) return;
    c.el.classList.add('leaving');
    setTimeout(() => c.el.remove(), 460);
    S.spots[i] = null;
    document.querySelectorAll('.pat')[i].className = 'pat';
  }

  function diff(cup, dr) {
    if (cup.base !== dr.cup) return dr.cup === 'iced' ? 'I wanted it iced!' : 'I wanted it hot!';
    const need = [...dr.items];
    for (const k of cup.items) { const j = need.indexOf(k); if (j >= 0) need.splice(j, 1); else return `No ${ING[k].label.toLowerCase()}, please!`; }
    if (need.length) return `Missing ${ING[need[0]].label.toLowerCase()}!`;
    return null;
  }

  function reject(c, msg) {
    c.p = Math.max(0.02, c.p - .25);
    S.streak = 0; S.stats.wrong++;
    c.el.classList.remove('wrong'); void c.el.offsetWidth; c.el.classList.add('wrong');
    floater(c.el.querySelector('.ticket'), msg, 'bad');
    sfx.bad(); renderHUD();
  }

  function serve(i) {
    if (!S || !S.running || S.paused) return;
    setTimeout(tutPoke, 0);
    const c = S.spots[i]; if (!c) return;
    const P = pastries();
    if (S.sel.k === 'oven') {
      const slot = S.oven[S.sel.i];
      if (!slot) { hint('Pick a pastry from the oven first.'); return; }
      if (slot.st === 'warm') { hint('That pastry is still warming.'); return; }
      if (!c.o.pastry) return reject(c, "I didn't order food!");
      if (c.pastryDone) return reject(c, 'I already have my food!');
      if (slot.st === 'burnt') return reject(c, "It's burnt!");
      if (slot.key !== c.o.pastry) return reject(c, `I wanted the ${P[c.o.pastry].label.toLowerCase()}!`);
      S.oven[S.sel.i] = null; S.sel = { k: 'cup', i: S.cupSel };
      c.pastryDone = true; S.stats.pastries++;
      c.el.querySelector('.part.p').classList.add('done');
      renderOven(); renderCups();
    } else {
      const cup = S.cups[S.sel.i];
      if (!cup.base) { hint(c.o.drink ? 'Make their drink first. Start with a cup.' : 'They only want food. Warm a pastry in the oven.'); return; }
      if (cup.busy) { hint('Hang on, that cup is still being filled.'); return; }
      if (!c.o.drink) return reject(c, 'I only wanted food!');
      if (c.drinkDone) return reject(c, 'I already have my drink!');
      const problem = diff(cup, c.o.drink);
      if (problem) return reject(c, problem);
      S.cups[S.sel.i] = mkCup();
      c.drinkDone = true; S.stats.byDrink[c.o.drink.name] = (S.stats.byDrink[c.o.drink.name] || 0) + 1;
      c.el.querySelector('.part.d').classList.add('done');
      renderCups();
    }
    if ((c.o.drink && !c.drinkDone) || (c.o.pastry && !c.pastryDone)) {
      c.p = Math.min(1, c.p + .15);
      floater(c.el.querySelector('.ticket'), '✓ One more thing!', 'combo');
      sfx.done(); renderHUD();
      return;
    }
    pay(i);
  }

  function pay(i) {
    const c = S.spots[i], o = c.o, P = pastries(), tk = c.el.querySelector('.ticket');
    S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak);
    let base = 0;
    if (o.drink) base += o.drink.price * (o.drink.special ? 1.5 : 1);
    if (o.pastry) base += P[o.pastry].price;
    const tip = base * (0.15 + 0.5 * c.p) * (o.kind === 'regular' ? 1.5 * (1 + .1 * (hearts(o.who) - 1)) : 1);
    let earned = (base + tip) * (1 + 0.1 * Math.min(S.streak - 1, 5));
    if (o.kind === 'critic') earned *= 2.5;
    earned *= tipMult();
    if (S.inRush) earned *= 1.25;
    earned *= difficulty().pay;
    S.money += earned; S.stats.served++;
    if (o.kind === 'regular') { S.stats.regulars++; SAVE.regs[o.who] = (SAVE.regs[o.who] || 0) + 1; }
    if (o.kind === 'critic') S.stats.critics++;
    if (o.drink && o.drink.sig) S.stats.sig++;
    floater(tk, '+' + money(earned));
    if (o.kind === 'critic') floater(tk, 'Rave review!', 'combo', 22);
    else if (o.kind === 'regular') floater(tk, `Thanks! See you tomorrow`, 'combo', 22);
    else if (S.streak >= 2) floater(tk, `Combo ×${S.streak}`, 'combo', 22);
    sfx.cash();
    leave(i);
    renderHUD();
  }

  /* ---------- Cups, stations, oven ---------- */
  function selectCup(i) {
    if (!S || !S.running || S.paused || i >= S.cups.length) return;
    S.cupSel = i; S.sel = { k: 'cup', i }; sfx.click(); renderCups(); renderOven();
  }

  function add(k) {
    if (!S || !S.running || S.paused) return;
    setTimeout(tutPoke, 0);
    const ing = ING[k];
    if (S.sel.k !== 'cup') { S.sel = { k: 'cup', i: S.cupSel }; renderOven(); }
    const cup = S.cups[S.cupSel];
    if (ing.cup) {
      if (cup.base && cup.items.length) { hint('This cup has stuff in it. Dump it or pick another cup.'); return; }
      cup.base = k; sfx.click(); renderCups(); return;
    }
    if (!cup.base) { hint('Grab a hot or iced cup first.'); return; }
    if (cup.busy) { hint('That cup is busy. Switch to another cup.'); return; }
    if (cup.items.length >= 6) { hint('This cup is full.'); return; }
    if (ing.station) {
      if (S.busy[ing.station] >= cap(ing.station)) { hint(`The ${ing.note} is busy.`); return; }
      S.busy[ing.station]++;
      cup.busy = { k, start: S.t, until: S.t + stationTime(k) };
      sfx.click(); renderCups(); return;
    }
    cup.items.push(k); sfx.click(); renderCups();
  }
  const tutPoke = () => { if (S && S.tut) tutTick(); };

  function bake(k) {
    if (!S || !S.running || S.paused || !S.oven.length) return;
    const free = S.oven.findIndex(x => !x);
    if (free < 0) { hint('The oven is full. Serve or dump a pastry first.'); return; }
    S.oven[free] = { key: k, t0: S.t, readyAt: S.t + warmTime(), burnAt: S.t + warmTime() + burnTime(), st: 'warm' };
    sfx.click(); renderOven();
  }

  function selectOven(i) {
    if (!S || !S.running || S.paused) return;
    const o = S.oven[i];
    if (!o) { hint('Tap a pastry in the case to warm it here.'); return; }
    if (o.st === 'warm') { hint('Still warming…'); return; }
    S.sel = { k: 'oven', i }; sfx.click();
    if (o.st === 'burnt') hint('Burnt! Tap Dump to toss it.');
    renderOven(); renderCups();
  }

  function cupHTML(cup, i) {
    let vis;
    if (!cup.base) vis = `<span class="emptycup">no cup</span>`;
    else {
      const layers = cup.items.map(k => `<span class="layer${ING[k].top ? ' top' : ''}" style="--c:${ING[k].c}"></span>`).join('');
      vis = `<span class="cupholder ${cup.base}" style="display:block"><span class="cup ${cup.base}">${layers}</span></span>`;
    }
    const parts = cup.items.map(k => ING[k].label);
    if (cup.busy) parts.push(ING[cup.busy.k].label + '…');
    const txt = !cup.base ? 'Pick a cup' : (ING[cup.base].label + (parts.length ? ': ' + parts.join(', ') : ''));
    return `<span class="cupwrap">${vis}</span><span class="meta"><span class="lbl" style="display:block"><span class="lbl-f">Cup ${i + 1} · key ${i + 1}</span><span class="lbl-m">Cup ${i + 1}</span></span><span class="contents" style="display:block">${txt}</span>${cup.busy ? '<span class="prog"><i></i></span>' : ''}</span>`;
  }

  function renderCups() {
    const wrap = $('#cups');
    wrap.style.setProperty('--n', S.cups.length);
    wrap.dataset.n = S.cups.length;
    wrap.innerHTML = S.cups.map((cup, i) => {
      const act = S.sel.k === 'cup' && S.sel.i === i, tgt = !act && S.cupSel === i;
      return `<button class="slot${act ? ' active' : ''}${tgt ? ' target' : ''}" type="button" data-i="${i}" aria-pressed="${act}">${cupHTML(cup, i)}</button>`;
    }).join('');
  }

  function renderOven() {
    const wrap = $('#ovslots');
    if (!S.oven.length) { wrap.innerHTML = ''; return; }
    wrap.style.setProperty('--n', S.oven.length);
    const P = pastries();
    wrap.innerHTML = S.oven.map((o, i) => {
      if (!o) return `<button class="ovslot" type="button" data-i="${i}"><span>empty</span><span class="kbd">${i + 4}</span></button>`;
      const act = S.sel.k === 'oven' && S.sel.i === i;
      const label = o.st === 'warm' ? 'Warming' : o.st === 'ready' ? 'Ready!' : 'Burnt';
      return `<button class="ovslot ${o.st}${act ? ' active' : ''}" type="button" data-i="${i}" aria-label="${esc(P[o.key].label)}: ${label}">${pastryHTML(P[o.key].look, o.st === 'warm' ? 'cold' : o.st === 'burnt' ? 'burnt' : '')}<span>${label}</span><span class="obar"><i></i></span><span class="kbd">${i + 4}</span></button>`;
    }).join('');
  }

  /* ---------- HUD ---------- */
  function renderHUD() {
    $('#day').textContent = S.day;
    const left = S.tut ? S.c.dur : Math.max(0, Math.ceil(S.c.dur - S.t));
    $('#clock').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    $('#money').textContent = money(S.money);
    const pct = Math.min(100, S.money / S.c.goal * 100);
    const gf = $('#goalfill'); gf.style.width = pct + '%'; gf.classList.toggle('met', pct >= 100);
    $('#streakv').textContent = '×' + S.streak;
    $('#streak').classList.toggle('hot', S.streak >= 3);
    const tk = $('#task');
    tk.hidden = !S.task;
    if (S.task) {
      const st = taskStatus(S.task);
      $('#taskText').textContent = S.task.text;
      $('#taskFill').style.width = st.frac * 100 + '%';
      $('#taskProg').textContent = st.label;
      $('#taskReward').textContent = '+' + money(S.task.reward);
      tk.classList.toggle('done', st.done && !!S.task.n);
      if (S.running && S.task.n && S.lastTaskLabel !== undefined && st.label !== S.lastTaskLabel) {
        hint(st.done ? `Challenge done! +${money(S.task.reward)}` : `Challenge: ${st.label}`, true);
      }
      S.lastTaskLabel = st.label;
    }
  }

  /* ---------- Loop ---------- */
  let last = performance.now();
  function loop(ts) {
    const dt = Math.min(.1, (ts - last) / 1000); last = ts;
    if (S && S.running && !S.paused) update(dt);
    requestAnimationFrame(loop);
  }

  let lastSec = -1;
  function update(dt) {
    S.t += dt;
    const left = S.c.dur - S.t;

    if (!S.tut) {
    const inR = !!S.rush && S.t >= S.rush.start && S.t < S.rush.end;
    if (inR !== S.inRush) { S.inRush = inR; $('#rush').hidden = !inR; if (inR) { sfx.bell(); S.nextSpawn = Math.min(S.nextSpawn, S.t + 1); } }

    if (left > 6 && S.t >= S.nextSpawn) {
      S.nextSpawn = S.t + (spawn() ? S.c.spawn * (0.75 + Math.random() * .5) * (S.inRush ? .55 : 1) : 1);
    }

    S.spots.forEach((c, i) => {
      if (!c) return;
      c.p -= dt / c.patience;
      const mood = c.p > .6 ? '' : c.p > .3 ? 'meh' : 'mad';
      if (c.mood !== mood) { c.el.classList.remove('meh', 'mad'); if (mood) c.el.classList.add(mood); c.mood = mood; }
      const pat = document.querySelectorAll('.pat')[i];
      pat.className = 'pat on ' + mood;
      pat.firstElementChild.style.width = Math.max(0, c.p * 100) + '%';
      if (c.p <= 0) {
        S.stats.missed++; S.streak = 0;
        floater(c.el.querySelector('.ticket'), c.o.kind === 'critic' ? 'Bad review…' : 'Walked out', 'bad');
        sfx.walk(); leave(i); renderHUD();
      }
    });

    }

    let cupsChanged = false;
    const frac = {};
    S.cups.forEach((cup, i) => {
      if (!cup.busy) return;
      const b = cup.busy, f = Math.min(1, (S.t - b.start) / (b.until - b.start));
      frac[b.k] = Math.max(frac[b.k] || 0, f);
      const bar = document.querySelector(`#cups .slot[data-i="${i}"] .prog i`); if (bar) bar.style.width = f * 100 + '%';
      if (S.t >= b.until) {
        cup.items.push(b.k); cup.busy = null;
        S.busy[ING[b.k].station]--;
        sfx.done(); cupsChanged = true;
      }
    });
    Object.entries(stationBusyEls).forEach(([k, el]) => { el.style.width = (frac[k] || 0) * 100 + '%'; });
    if (cupsChanged) renderCups();

    let ovenChanged = false;
    S.oven.forEach((o, i) => {
      if (!o) return;
      const st = S.t < o.readyAt ? 'warm' : S.t < o.burnAt ? 'ready' : 'burnt';
      if (st !== o.st) { o.st = st; ovenChanged = true; st === 'ready' ? sfx.done() : st === 'burnt' && sfx.burn(); }
      const bar = document.querySelector(`#ovslots .ovslot[data-i="${i}"] .obar i`);
      if (bar) bar.style.width = (st === 'warm' ? (S.t - o.t0) / (o.readyAt - o.t0) : st === 'ready' ? 1 - (S.t - o.readyAt) / (o.burnAt - o.readyAt) : 0) * 100 + '%';
    });
    if (ovenChanged) renderOven();

    if (S.tut) { tutTick(); return; }
    const sec = Math.ceil(left);
    if (sec !== lastSec) { lastSec = sec; renderHUD(); if (sec <= 5 && sec > 0) beep(660, .05, 'square', .03); }
    if (left <= 0) endDay();
  }

  function unlocksFor(n) {
    const P = pastries();
    const list = [
      ...STATION_ORDER.filter(k => ING[k].day === n).map(k => ING[k].label),
      ...DRINKS.filter(d => d.day === n).map(d => d.name),
      ...Object.keys(PASTRY_BASE).filter(k => P[k].day === n).map(k => P[k].label),
    ];
    if (n === OAT_DAY) list.push('“Oat” requests');
    if (n === SHOT_DAY) list.push('“+Shot” requests');
    if (NEWS[n]) list.push(NEWS[n].title.toLowerCase());
    return list;
  }

  function endDay() {
    S.running = false; S.inRush = false; $('#rush').hidden = true;
    S.spots.forEach((c, i) => c && leave(i));
    S.cups.forEach(c => c.busy = null); S.busy = { machine: 0, steamer: 0 };
    S.oven = S.oven.map(() => null); S.sel = { k: 'cup', i: S.cupSel };
    Object.values(stationBusyEls).forEach(b => b.style.width = 0);
    renderCups(); renderOven();
    const ratio = S.money / S.c.goal, pass = ratio >= 1;
    const stars = pass ? (ratio >= 1.6 ? 3 : ratio >= 1.3 ? 2 : 1) : 0;
    const taskDone = S.task ? taskStatus(S.task).done : false;
    const bonus = taskDone ? S.task.reward : 0;
    const added = Math.round((S.money + bonus) * 100) / 100;
    SAVE.bank = Math.round((SAVE.bank + added) * 100) / 100;
    if (pass && S.day > SAVE.best) SAVE.best = S.day;
    if (pass) SAVE.stars[S.day] = Math.max(SAVE.stars[S.day] || 0, stars);
    const T = SAVE.tot;
    T.shifts++; T.served += S.stats.served; T.pastries += S.stats.pastries; T.critics += S.stats.critics; T.sig += S.stats.sig;
    if (taskDone) T.tasks++;
    if (S.stats.served > 0 && S.stats.missed === 0 && S.stats.wrong === 0) T.perfect++;
    T.bestCombo = Math.max(T.bestCombo, S.bestStreak);
    const newStickers = checkStickers();
    persist();
    const R = { day: S.day, pass, stars, money: S.money, goal: S.c.goal, stats: { ...S.stats }, bestStreak: S.bestStreak, task: S.task && S.task.text, taskDone, bonus, added, hasOven: S.oven.length > 0, stickers: newStickers.map(x => ({ name: x.name, reward: x.reward })) };
    showResults(R);
    sfx.bell();
  }

  function showResults(R) {
    const next = R.day + 1;
    const unlocks = R.pass ? unlocksFor(next) : [];
    showCard(`
      <h2>${R.pass ? 'Shift complete!' : 'Not quite…'}</h2>
      <div class="stars">${[1, 2, 3].map(n => n <= R.stars ? '<b>★</b>' : '★').join('')}</div>
      <div class="results">
        <span>Tips today</span><span>${money(R.money)}</span>
        <span>Day goal</span><span>${money(R.goal)}</span>
        <span>Customers served</span><span>${R.stats.served}</span>
        ${R.hasOven ? `<span>Pastries served</span><span>${R.stats.pastries}</span>` : ''}
        <span>Wrong handoffs</span><span>${R.stats.wrong}</span>
        <span>Walkouts</span><span>${R.stats.missed}</span>
        <span>Best combo</span><span>×${R.bestStreak}</span>
        ${R.task ? `<span>Challenge: ${R.task}</span><span>${R.taskDone ? '✓ +' + money(R.bonus) : '✗'}</span>` : ''}
      </div>
      <p class="bank">Savings: ${money(SAVE.bank)} <span class="small">(+${money(R.added)})</span></p>
      ${R.stickers && R.stickers.length ? `<div class="unlock goal"><b>New sticker${R.stickers.length > 1 ? 's' : ''}!</b> ${R.stickers.map(x => `${x.name} (+${money(x.reward)})`).join(', ')}</div>` : ''}
      ${unlocks.length ? `<div class="unlock"><b>Day ${next} unlocks:</b> ${unlocks.join(', ')}</div>` : ''}
      ${R.pass ? '' : `<p>You needed ${money(R.goal - R.money)} more. You still keep today's tips. Upgrades in the Shop can help.</p>`}
      <div class="btnrow">
        ${R.pass ? `<button class="big" id="nextBtn" type="button">Open Day ${next}</button>` : `<button class="big" id="retryBtn" type="button">Retry Day ${R.day}</button>`}
        <button class="big alt" id="shopBtn" type="button">Shop</button>
        <button class="big alt" id="homeBtn" type="button">Title</button>
      </div>`);
    const nb = $('#nextBtn'), rb = $('#retryBtn');
    if (nb) nb.onclick = () => startDay(next);
    if (rb) rb.onclick = () => startDay(R.day);
    $('#shopBtn').onclick = () => openShop(() => showResults(R));
    $('#homeBtn').onclick = title;
  }

  /* ---------- Shop ---------- */
  let shopBack = null;
  function openShop(back) { initAudio(); shopBack = back; renderShop(); }

  let shopNote = '';
  function renderShop() {
    const r = reach();
    const priceBtn = (attr, id, price, day) => day && day > r
      ? `<button class="buy" type="button" disabled>Day ${day}</button>`
      : `<button class="buy" type="button" data-${attr}="${id}" ${SAVE.bank < price ? 'disabled' : ''}>Buy ${money(price)}</button>`;
    const owned = label => `<button class="buy owned" type="button" disabled>${label}</button>`;
    const row = (name, desc, btn, extra = '') => `<div class="item"><span class="nm">${name}${extra}</span><span class="ds">${desc}</span>${btn}</div>`;
    const tiers = TIERS.map(t => {
      const L = lv(t.id), max = t.levels.length;
      const pips = ` <span class="pips" aria-label="Level ${L} of ${max}">${t.levels.map((_, i) => `<i class="${i < L ? 'on' : ''}"></i>`).join('')}</span>`;
      if (L >= max) return row(t.name, t.levels[max - 1][1], owned('Maxed'), pips);
      const [price, desc] = t.levels[L];
      return row(t.name, (L ? 'Next level: ' : '') + desc + '.', priceBtn('tier', t.id, price, t.day), pips);
    }).join('');
    const ups = UPGRADES.map(it => row(it.name, it.desc, own(it.id) ? owned('Owned') : priceBtn('buy', it.id, it.price, it.day))).join('');
    const decor = DECOR.map(d => row(d.name, d.desc || 'Shows up in your café and adds 2% to every order.',
      own(d.id) ? owned('Owned') : priceBtn('buy', d.id, d.price), ` <span class="dprev">${decorHTML(d.cls, true)}</span>`)).join('');
    const makers = MAKERS.map(it => {
      const made = it.id === 'sigdrink' ? SAVE.sigDrink : SAVE.sigPastry;
      const extra = made ? ` <span class="newtag sig">${esc(made.name)}</span>` : '';
      return row(it.name, it.desc, own(it.id) ? `<button class="buy owned" type="button" data-make="${it.id}">${made ? 'Edit' : 'Create'}</button>` : priceBtn('buy', it.id, it.price, it.day), extra);
    }).join('');
    const themes = THEMES.map(t => {
      const sw = ` <span class="swatch">${['wall', 'wood', 'awn', 'bar'].map(k => `<i style="--c:${t.v[k]}"></i>`).join('')}</span>`;
      const btn = own(t.id)
        ? (SAVE.theme === t.id ? owned('In use') : `<button class="buy owned" type="button" data-use="${t.id}">Use</button>`)
        : priceBtn('buy', t.id, t.price);
      return row(t.name, t.price ? 'New walls, counter, awning and bar colors.' : 'The original look.', btn, sw);
    }).join('');
    const cozy = Math.round((tipMult() / [1, 1.08, 1.16, 1.25][lv('tipsign')] - 1) * 100);
    showCard(`
      <h2>Café shop</h2>
      <p class="bank">Savings: ${money(SAVE.bank)}</p>
      ${shopNote ? `<div class="shopnote">${shopNote}</div>` : ''}
      <p class="small" style="margin-top:-6px">You keep every day's tips, even on days you miss the goal.</p>
      <div class="btnrow"><button class="big alt" id="stkBtn" type="button">Sticker book · ${STICKERS.filter(x => SAVE.ach[x.id]).length}/${STICKERS.length}</button></div>
      <div class="shopsec"><h3>Upgrades</h3>${tiers}${ups}</div>
      <div class="shopsec"><h3>Decor · cozy bonus now +${cozy}%</h3>${decor}</div>
      <div class="shopsec"><h3>Make it yours</h3>${makers}</div>
      <div class="shopsec"><h3>Café themes</h3>${themes}</div>
      <div class="btnrow" style="margin-top:14px"><button class="big" id="shopDone" type="button">Done</button></div>`, 'wide');
    shopNote = '';
    document.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => buy(b.dataset.buy));
    document.querySelectorAll('[data-tier]').forEach(b => b.onclick = () => buyTier(b.dataset.tier));
    document.querySelectorAll('[data-make]').forEach(b => b.onclick = () => b.dataset.make === 'sigdrink' ? drinkMaker() : pastryMaker());
    document.querySelectorAll('[data-use]').forEach(b => b.onclick = () => { SAVE.theme = b.dataset.use; applyTheme(SAVE.theme); persist(); sfx.click(); renderShop(); });
    $('#stkBtn').onclick = () => stickerBook(renderShop);
    $('#shopDone').onclick = () => { if (S && !S.running) { buildStations(); renderCups(); renderOven(); renderMenu(); } shopBack ? shopBack() : title(); };
  }

  function afterPurchase() {
    const fresh = checkStickers();
    if (fresh.length) shopNote = `New sticker: ${fresh.map(x => `${x.name} (+${money(x.reward)})`).join(', ')}`;
    persist(); sfx.cash();
  }

  function buy(id) {
    const it = [...UPGRADES, ...MAKERS, ...THEMES, ...DECOR].find(x => x.id === id);
    if (!it || own(id) || SAVE.bank < it.price) return;
    SAVE.bank = Math.round((SAVE.bank - it.price) * 100) / 100;
    SAVE.owned[id] = true;
    if (id.startsWith('theme_')) { SAVE.theme = id; applyTheme(id); }
    if (id.startsWith('decor_')) renderDecor();
    afterPurchase();
    if (id === 'sigdrink') drinkMaker();
    else if (id === 'sigpastry') pastryMaker();
    else renderShop();
  }

  function buyTier(id) {
    const t = TIERS.find(x => x.id === id), L = lv(id);
    if (!t || L >= t.levels.length) return;
    const price = t.levels[L][0];
    if (SAVE.bank < price) return;
    SAVE.bank = Math.round((SAVE.bank - price) * 100) / 100;
    SAVE.lv[id] = L + 1;
    afterPurchase(); renderShop();
  }

  /* ---------- Decor + stickers ---------- */
  function decorHTML(cls, preview = false) {
    if (cls === 'lights') return preview ? '<span class="dc lightsicon"></span>' : '';
    return cls === 'sign' ? '<span class="dc sign">LOX</span>' : `<span class="dc ${cls}"></span>`;
  }
  function renderDecor() {
    $('#lights').hidden = !own('decor_lights');
    $('#decor').innerHTML = DECOR.filter(d => d.cls !== 'lights' && own(d.id)).map(d => decorHTML(d.cls)).join('');
  }

  function checkStickers() {
    const fresh = STICKERS.filter(x => !SAVE.ach[x.id] && x.cur() >= x.goal);
    fresh.forEach(x => { SAVE.ach[x.id] = true; SAVE.bank = Math.round((SAVE.bank + x.reward) * 100) / 100; });
    return fresh;
  }

  function stickerBook(back) {
    const got = STICKERS.filter(x => SAVE.ach[x.id]).length;
    showCard(`
      <h2>Sticker book</h2>
      <p>${got} of ${STICKERS.length} collected. Each sticker adds a bonus to your savings.</p>
      <div class="stickers">${STICKERS.map((x, i) => {
        const have = !!SAVE.ach[x.id], cur = Math.min(x.goal, x.cur());
        return `<div class="stk${have ? ' have' : ''}"><span class="badge" style="--c:${BADGE[i % BADGE.length]}">★</span><b>${x.name}</b><span>${x.desc}</span><span class="sp">${have ? 'Earned · +' + money(x.reward) : `${cur.toLocaleString()} / ${x.goal.toLocaleString()} · +${money(x.reward)}`}</span></div>`;
      }).join('')}</div>
      <div class="btnrow"><button class="big" id="stkDone" type="button">Done</button></div>`, 'wide');
    $('#stkDone').onclick = back;
  }

  /* ---------- Signature makers ---------- */
  let draft = null;
  const sigDrinkPrice = n => Math.round((2.5 + 0.8 * n) * 1.5 * 4) / 4;

  function drinkMaker() {
    const r = reach();
    if (!draft || draft.type !== 'drink') {
      const s = SAVE.sigDrink;
      draft = s ? { type: 'drink', name: s.name, cup: s.cup, items: [...s.items] } : { type: 'drink', name: '', cup: 'hot', items: [] };
    }
    const ings = STATION_ORDER.filter(k => !ING[k].cup && ING[k].day <= r);
    const n = draft.items.length;
    const chip = k => `<span class="dot" style="--c:${ING[k].c}"></span>${ING[k].label}`;
    showCard(`
      <h2>Signature drink</h2>
      <div class="field"><label for="sigName">Name it</label><input id="sigName" maxlength="22" placeholder="The Lox Special" value="${esc(draft.name)}" autocomplete="off"></div>
      <span class="plabel">Cup</span>
      <div class="picks">${['hot', 'iced'].map(k => `<button type="button" class="pick${draft.cup === k ? ' on' : ''}" data-cup="${k}" ${ING[k].day > r ? 'disabled' : ''}>${chip(k)}</button>`).join('')}</div>
      <span class="plabel">Add ingredients (2 to 5, repeats are fine)</span>
      <div class="picks">${ings.map(k => `<button type="button" class="pick" data-add="${k}" ${n >= 5 ? 'disabled' : ''}>${chip(k)}</button>`).join('')}</div>
      <span class="plabel">Your recipe${n ? ' · tap an ingredient to take it out' : ''}</span>
      <div class="picks"><span class="pick on static">${chip(draft.cup)}</span>${draft.items.map((k, i) => `<button type="button" class="pick on" data-rm="${i}">${chip(k)} ×</button>`).join('')}</div>
      <p>Sells for <b>${money(sigDrinkPrice(Math.max(n, 2)))}</b>. It shows up on days when you have all its ingredients.</p>
      <div class="btnrow"><button class="big" id="sigSave" type="button" ${n < 2 ? 'disabled' : ''}>Add to menu</button><button class="big alt" id="sigBack" type="button">Back to shop</button></div>`, 'wide', false);
    const inp = $('#sigName'); inp.oninput = () => { draft.name = inp.value; };
    document.querySelectorAll('[data-cup]').forEach(b => b.onclick = () => { draft.cup = b.dataset.cup; drinkMaker(); });
    document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { if (draft.items.length < 5) draft.items.push(b.dataset.add); sfx.click(); drinkMaker(); });
    document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { draft.items.splice(+b.dataset.rm, 1); drinkMaker(); });
    $('#sigSave').onclick = () => {
      let name = draft.name.trim() || 'The Lox Special';
      if (DRINKS.some(d => d.name.toLowerCase() === name.toLowerCase())) name += ' (yours)';
      SAVE.sigDrink = { name, cup: draft.cup, items: [...draft.items], price: sigDrinkPrice(draft.items.length), day: Math.max(ING[draft.cup].day, ...draft.items.map(k => ING[k].day)) };
      persist(); draft = null; sfx.cash(); renderShop();
    };
    $('#sigBack').onclick = () => { draft = null; renderShop(); };
  }

  function pastryMaker() {
    const r = reach();
    if (!draft || draft.type !== 'pastry') {
      const s = SAVE.sigPastry;
      draft = s ? { type: 'pastry', name: s.name, ...s.look } : { type: 'pastry', name: '', base: 'scone', glaze: 'pink', top: 'sprinkles' };
    }
    const bases = SIG_BASES.filter(b => b.day <= r);
    const pick = (attr, id, label, on, extra = '') => `<button type="button" class="pick${on ? ' on' : ''}" data-${attr}="${id}">${extra}${label}</button>`;
    showCard(`
      <h2>Signature pastry</h2>
      <div class="preview">${pastryHTML({ base: draft.base, glaze: draft.glaze, top: draft.top }, 'big')}</div>
      <div class="field"><label for="sigName">Name it</label><input id="sigName" maxlength="22" placeholder="Lapis Scone" value="${esc(draft.name)}" autocomplete="off"></div>
      <span class="plabel">Base</span>
      <div class="picks">${bases.map(b => pick('base', b.id, b.label, draft.base === b.id)).join('')}</div>
      <span class="plabel">Glaze</span>
      <div class="picks">${GLAZES.map(g => pick('glaze', g.id, g.label, draft.glaze === g.id, g.c ? `<span class="dot" style="--c:${g.c}"></span>` : '')).join('')}</div>
      <span class="plabel">Topping</span>
      <div class="picks">${TOPS.map(t => pick('top', t.id, t.label, draft.top === t.id)).join('')}</div>
      <p>Sells for <b>${money(5.5)}</b>. Warm it in the oven like the others.</p>
      <div class="btnrow"><button class="big" id="sigSave" type="button">Add to the case</button><button class="big alt" id="sigBack" type="button">Back to shop</button></div>`, 'wide', false);
    const inp = $('#sigName'); inp.oninput = () => { draft.name = inp.value; };
    ['base', 'glaze', 'top'].forEach(a => document.querySelectorAll(`[data-${a}]`).forEach(b => b.onclick = () => { draft[a] = b.dataset[a]; sfx.click(); pastryMaker(); }));
    $('#sigSave').onclick = () => {
      const name = draft.name.trim() || 'Lox Special Pastry';
      SAVE.sigPastry = { name, look: { base: draft.base, glaze: draft.glaze, top: draft.top }, day: SIG_BASES.find(b => b.id === draft.base).day };
      persist(); draft = null; sfx.cash(); renderShop();
    };
    $('#sigBack').onclick = () => { draft = null; renderShop(); };
  }

  /* ---------- Save codes: move progress between devices or addresses ---------- */
  const encodeSave = () => 'LOX1:' + btoa(unescape(encodeURIComponent(JSON.stringify(SAVE))));
  function decodeSave(code) {
    const m = String(code).trim().replace(/\s+/g, '').match(/^LOX1:([A-Za-z0-9+/=]+)$/);
    if (!m) return null;
    try {
      const s = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
      if (!s || typeof s !== 'object' || typeof s.best !== 'number' || typeof s.bank !== 'number') return null;
      return normalizeSave(s);
    } catch (e) { return null; }
  }

  function saveCodeCard(msg = '', pending = null) {
    const p = pending;
    showCard(`
      <h2>Save code</h2>
      <p>Move your café to another phone, computer or browser. Copy your code here, then paste it into Save code on the other device.</p>
      <div class="field"><label for="myCode">Your code · Day ${SAVE.best}, ${money(SAVE.bank)} saved</label>
        <textarea id="myCode" class="code" readonly rows="3">${encodeSave()}</textarea></div>
      <div class="btnrow"><button class="big" id="copyCode" type="button">Copy my code</button></div>
      <div class="field" style="margin-top:16px"><label for="pasteCode">Load a code</label>
        <textarea id="pasteCode" class="code" rows="3" placeholder="Paste a code that starts with LOX1:"></textarea></div>
      ${msg ? `<p class="codemsg">${msg}</p>` : ''}
      ${p ? `<div class="unlock goal"><b>Replace this café?</b> The code has Day ${p.best} cleared and ${money(p.bank)} saved. Your progress on this device gets replaced. Copy your own code first if you want to keep it.</div>
        <div class="btnrow"><button class="big" id="confirmLoad" type="button">Yes, load it</button><button class="big alt" id="cancelLoad" type="button">Cancel</button></div>`
        : `<div class="btnrow"><button class="big alt" id="loadCode" type="button">Load code</button><button class="big alt" id="codeBack" type="button">Back</button></div>`}`, 'wide', !p);
    const mine = $('#myCode');
    $('#copyCode').onclick = () => {
      const done = () => { $('#copyCode').textContent = 'Copied!'; };
      const fallback = () => { mine.focus(); mine.select(); $('#copyCode').textContent = 'Selected, now copy it'; };
      try { navigator.clipboard.writeText(mine.value).then(done, fallback); } catch (e) { fallback(); }
    };
    if (p) {
      $('#confirmLoad').onclick = () => {
        SAVE = p; persist(); applyTheme(SAVE.theme); renderDecor();
        S = freshState(1); buildStations(); renderMenu(); renderCups(); renderOven(); renderHUD();
        sfx.cash(); title();
      };
      $('#cancelLoad').onclick = () => saveCodeCard();
    } else {
      $('#loadCode').onclick = () => {
        const s = decodeSave($('#pasteCode').value);
        if (!s) { saveCodeCard("That code didn't work. Paste the whole thing, starting with LOX1:"); return; }
        saveCodeCard('', s);
      };
      $('#codeBack').onclick = title;
    }
  }

  function diffPicker() {
    const cur = SAVE.diff;
    return `<div class="diffpick" role="group" aria-label="Difficulty">${Object.entries(DIFFS).map(([id, m]) =>
      `<button type="button" class="dp${cur === id ? ' on' : ''}" data-diff="${id}" aria-pressed="${cur === id}">${m.label}</button>`).join('')}</div>
      <p class="small dpnote">${DIFFS[cur].note}</p>`;
  }
  function wireDiff(onChange) {
    document.querySelectorAll('[data-diff]').forEach(b => b.onclick = () => {
      if (SAVE.diff === b.dataset.diff) return;
      SAVE.diff = b.dataset.diff; persist(); sfx.click(); onChange();
    });
  }

  /* ---------- Keyboard shortcuts (computers) ---------- */
  const KEYS = { hot: 'q', iced: 'w', shot: 'e', water: 'r', milk: 't', oat: 'y', foam: 'u', vanilla: 'i', caramel: 'o', choc: 'p',
                 chai: 'z', matcha: 'x', pumpkin: 'c', whip: 'v' };
  const PKEYS = { croissant: 'b', muffin: 'n', cookie: 'm', sig: ',' };
  const SPOT_KEYS = ['a', 's', 'd', 'f'];
  function keysCard(back) {
    const row = (k, what) => `<div class="krow"><span class="kcap">${k}</span><span>${what}</span></div>`;
    const sk = Object.entries(KEYS).map(([k, key]) => row(key.toUpperCase(), ING[k].label)).join('');
    const pk = Object.entries(PKEYS).map(([k, key]) => row(key === ',' ? ',' : key.toUpperCase(), k === 'sig' ? 'Your signature pastry' : PASTRY_BASE[k].label)).join('');
    showCard(`
      <h2>Keyboard shortcuts</h2>
      <p>Play without the mouse. Keys also show on each button.</p>
      <div class="kgrid">
        <div><h3>Serve &amp; pick</h3>
          ${row('A S D F', 'Serve customer 1–4 (left to right)')}
          ${row('1 2 3', 'Pick cup 1–3')}
          ${row('4 5 6', 'Pick from oven slot 1–3')}
          ${row('⌫', 'Dump what you picked')}
          ${row('Esc', 'Pause')}
          ${row('?', 'This list')}
        </div>
        <div><h3>Stations</h3>${sk}</div>
        <div><h3>Pastry case</h3>${pk}</div>
      </div>
      <div class="btnrow"><button class="big" id="keysDone" type="button">Got it</button></div>`, 'wide');
    $('#keysDone').onclick = back;
  }

  /* ---------- Tutorial: a guided first latte ---------- */
  let tutForce = false;
  const stationEl = k => document.querySelector(`#stations .station[data-k="${k}"]`);
  const anyCup = f => S.cups.some(f);
  const TUT = [
    { el: () => S.spots[1] && [S.spots[1].el.querySelector('.ticket'), S.spots[1].el.querySelector('.person')], next: 'Next',
      text: 'Your first customer! Their ticket shows the order: a <b>Latte</b>. The little tags under it spell out the recipe: <b>Hot cup + Espresso + Milk</b>.' },
    { el: () => stationEl('hot'), done: () => anyCup(c => c.base === 'hot'),
      text: 'Every drink starts with a cup. Tap <b>Hot cup</b>.' },
    { el: () => stationEl('shot'), done: () => anyCup(c => c.items.includes('shot')),
      text: () => anyCup(c => c.busy && c.busy.k === 'shot') ? 'Pulling the shot… it takes a second. Watch the bar fill up.' : 'Now tap <b>Espresso</b>. The machine needs a second to pull the shot.' },
    { el: () => stationEl('milk'), done: () => anyCup(c => c.items.includes('milk')),
      text: () => anyCup(c => c.busy && c.busy.k === 'milk') ? 'Steaming the milk…' : 'Last ingredient: tap <b>Milk</b>.' },
    { el: () => S.spots[1] && [S.spots[1].el.querySelector('.ticket'), S.spots[1].el.querySelector('.person')], done: () => S.stats.served >= 1,
      text: 'Your cup matches the ticket. <b>Tap the customer</b> to hand it over.' },
    { el: () => $('#money').closest('.stat'), next: 'Next',
      text: 'You got paid! Tips go here. The faster you serve, the bigger the tip. Reach the day\'s goal before the shift ends to unlock new drinks.' },
    { el: () => $('#menuBtn'), next: 'Start my shift!',
      text: 'Forgot a recipe? <b>Menu</b> pauses the clock and shows them all. Pro tip: you have two cups, so start a second drink while a shot is pulling.' },
  ];
  function startTut() {
    S.tut = { i: 0 };
    const look = randomLook(); look.acc = 'none';
    spawn({ kind: 'normal', who: null, look, pastry: null,
      drink: { name: 'Latte', day: 1, cup: 'hot', items: ['shot', 'milk'], price: 4.5, mods: [], sig: false, special: false } }, 1);
    $('#coach').hidden = false;
    showTutStep();
  }
  function showTutStep() {
    const st = TUT[S.tut.i];
    $('#tutStep').textContent = `Step ${S.tut.i + 1} of ${TUT.length}`;
    $('#bubbleText').innerHTML = typeof st.text === 'function' ? st.text() : st.text;
    const nb = $('#tutNext');
    nb.hidden = !st.next; nb.textContent = st.next || '';
    S.tut.lastText = $('#bubbleText').innerHTML;
    placeCoach();
    // Re-measure once walk-in animations settle
    setTimeout(() => { if (S.tut) placeCoach(); }, 500);
  }
  function placeCoach() {
    const st = TUT[S.tut.i], el = st.el();
    const ring = $('#ring'), bub = $('#bubble');
    if (!el) return;
    // A step can spotlight several elements (ticket + customer): use their combined box
    const rs = (Array.isArray(el) ? el : [el]).filter(Boolean).map(e => e.getBoundingClientRect());
    if (!rs.length) return;
    const r = { left: Math.min(...rs.map(x => x.left)), top: Math.min(...rs.map(x => x.top)), right: Math.max(...rs.map(x => x.right)), bottom: Math.max(...rs.map(x => x.bottom)) };
    r.width = r.right - r.left; r.height = r.bottom - r.top;
    const pad = 6;
    Object.assign(ring.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
    const bw = bub.offsetWidth, bh = bub.offsetHeight;
    const below = r.bottom + pad + 14 + bh < innerHeight - 8;
    const top = below ? r.bottom + pad + 14 : Math.max(8, r.top - pad - 14 - bh);
    const left = Math.min(Math.max(12, r.left + r.width / 2 - bw / 2), innerWidth - bw - 12);
    Object.assign(bub.style, { top: top + 'px', left: left + 'px' });
  }
  function tutTick() {
    const st = TUT[S.tut.i];
    if (st.done && st.done()) { advanceTut(); return; }
    if (typeof st.text === 'function') {
      const t = st.text();
      if (t !== S.tut.lastText) { $('#bubbleText').innerHTML = t; S.tut.lastText = t; }
    }
    placeCoach();
  }
  function advanceTut() {
    S.tut.i++;
    sfx.done();
    if (S.tut.i >= TUT.length) endTut(); else showTutStep();
  }
  function endTut() {
    S.tut = null;
    $('#coach').hidden = true;
    SAVE.tutDone = true; persist();
    // The real shift starts now, with a full clock
    S.t = 0; S.nextSpawn = 1.5; lastSec = -1; last = performance.now();
    S.spots.forEach(c => { if (c) c.p = 1; });
    renderHUD(); hint('Shift started. Good luck!', true);
  }
  $('#tutNext').addEventListener('click', advanceTut);
  $('#tutSkip').addEventListener('click', endTut);
  addEventListener('resize', () => { if (S && S.tut) placeCoach(); });

  /* ---------- Overlays ---------- */
  function showCard(html, cls = '', focus = true) {
    const card = $('#card');
    card.className = 'card ' + cls;
    card.innerHTML = html; $('#overlay').hidden = false;
    if (focus) { const f = card.querySelector('button:not(:disabled)'); if (f) f.focus({ preventScroll: true }); card.scrollTop = 0; }
  }

  function title() {
    if (S) { S.running = false; S.paused = false; S.tut = null; }
    $('#coach').hidden = true;
    $('#pauseBtn').textContent = 'Pause';
    const starCount = Object.values(SAVE.stars).reduce((a, b) => a + b, 0);
    showCard(`
      <img class="titlelogo" src="${LOGO}" alt="" width="120" height="120">
      <h1>Lox Café</h1>
      <span class="ver">V1.6 · Behind the Bar</span>
      <p class="bank">Savings: ${money(SAVE.bank)}${SAVE.best ? ` · Best: Day ${SAVE.best} · ${starCount} ★` : ''}</p>
      ${diffPicker()}
      <ol>
        <li>Customers line up with an order ticket.</li>
        <li>Pick a <b>hot or iced cup</b>, then tap stations to add ingredients. Espresso and milk take a moment, so juggle your cups.</li>
        <li><b>Tap the customer</b> to hand over what you've selected. Fast service means bigger tips; back-to-back right orders build a combo.</li>
      </ol>
      <p>Hit each day's goal to unlock new drinks. Every tip goes into savings for upgrades, themes and your own signature recipes.</p>
      <div class="btnrow">
        ${SAVE.best ? `<button class="big" id="contBtn" type="button">Continue at Day ${reach()}</button><button class="big alt" id="startBtn" type="button">Replay Day 1</button>` : `<button class="big" id="startBtn" type="button">Start Day 1</button>`}
        <button class="big alt" id="shopBtn" type="button">Shop</button>
        <button class="big alt" id="stkTitle" type="button">Stickers ${STICKERS.filter(x => SAVE.ach[x.id]).length}/${STICKERS.length}</button>
        <button class="big alt" id="codeTitle" type="button">Save code</button>
        <button class="big alt desk" id="keysTitle" type="button">Shortcuts</button>
        <button class="big alt" id="howTitle" type="button">How to play</button>
      </div>
      <p class="small">Progress saves in this browser. On a computer, press ? for keyboard shortcuts.</p>`);
    $('#startBtn').onclick = () => startDay(1);
    const cb = $('#contBtn'); if (cb) cb.onclick = () => startDay(reach());
    $('#shopBtn').onclick = () => openShop(title);
    $('#stkTitle').onclick = () => stickerBook(title);
    $('#codeTitle').onclick = () => saveCodeCard();
    $('#keysTitle').onclick = () => keysCard(title);
    $('#howTitle').onclick = () => { tutForce = true; startDay(1); };
    wireDiff(title);
  }

  function pause(on, view = 'break') {
    if (!S || !S.running) return;
    S.paused = on;
    $('#pauseBtn').textContent = on ? 'Resume' : 'Pause';
    if (on) {
      const btns = `${S.task ? `<div class="unlock goal"><b>Challenge:</b> ${S.task.text} · ${taskStatus(S.task).label}</div>` : ''}
        <div class="btnrow"><button class="big" id="resumeBtn" type="button">Back to the bar</button><button class="big alt" id="quitBtn" type="button">Title</button></div>
        <div class="btnrow" style="margin-top:10px"><button class="big alt" id="pSound" type="button"></button><button class="big alt" id="pHints" type="button"></button><button class="big alt desk" id="pKeys" type="button">Shortcuts</button></div>`;
      showCard(view === 'menu'
        ? `<h2>Day ${S.day} menu</h2><p>The clock is stopped while you look.</p>${recipesHTML(S.day)}${btns}`
        : `<h2>On break</h2><p>Customers will wait. Promise.</p>${btns}`);
      $('#resumeBtn').onclick = () => pause(false);
      $('#quitBtn').onclick = title;
      $('#pSound').onclick = toggleSound; $('#pHints').onclick = toggleHints; syncToggles();
      $('#pKeys').onclick = () => keysCard(() => pause(true, view));
    } else {
      $('#overlay').hidden = true; last = performance.now();
    }
  }

  /* ---------- Wiring ---------- */
  $('#cups').addEventListener('click', e => { const b = e.target.closest('.slot'); if (b) selectCup(+b.dataset.i); });
  $('#ovslots').addEventListener('click', e => { const b = e.target.closest('.ovslot'); if (b) selectOven(+b.dataset.i); });
  function dump() {
    if (!S || !S.running || S.paused) return;
    if (S.sel.k === 'oven') {
      if (S.oven[S.sel.i]) { S.oven[S.sel.i] = null; beep(220, .12, 'triangle', .06, -80); }
      S.sel = { k: 'cup', i: S.cupSel }; renderOven(); renderCups(); return;
    }
    const cup = S.cups[S.sel.i];
    if (cup.busy) S.busy[ING[cup.busy.k].station]--;
    S.cups[S.sel.i] = mkCup(); beep(220, .12, 'triangle', .06, -80); renderCups();
  }
  $('#trash').addEventListener('click', dump);
  $('#pauseBtn').addEventListener('click', () => pause(!(S && S.paused)));
  function syncToggles() {
    const sl = soundOn ? 'Sound on' : 'Sound off', hl = hintsAll ? 'Hints: all drinks' : 'Hints: new drinks';
    $('#soundBtn').textContent = sl; $('#soundBtn').setAttribute('aria-pressed', soundOn);
    $('#hintsBtn').textContent = hl; $('#hintsBtn').setAttribute('aria-pressed', hintsAll);
    const ps = $('#pSound'), ph = $('#pHints');
    if (ps) ps.textContent = sl;
    if (ph) ph.textContent = hl;
  }
  function toggleSound() { soundOn = !soundOn; syncToggles(); }
  function toggleHints() {
    hintsAll = !hintsAll; syncToggles();
    try { localStorage.setItem('lox-hints', hintsAll ? 'all' : 'new'); } catch (e) {}
    if (S) S.spots.forEach(c => c && c.el.classList.toggle('nochips', !showsRecipe(c.o)));
  }
  syncToggles();
  $('#hintsBtn').addEventListener('click', toggleHints);
  $('#menuBtn').addEventListener('click', () => { if (S && S.running && !S.paused) pause(true, 'menu'); });
  $('#soundBtn').addEventListener('click', toggleSound);
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!S || !S.running) return;
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (key === 'Escape') { pause(!S.paused); return; }
    if (key === '?' && !S.paused) { pause(true); keysCard(() => pause(true)); return; }
    if (S.paused) return;
    let hit = true;
    if (['1', '2', '3'].includes(key)) selectCup(+key - 1);
    else if (['4', '5', '6'].includes(key) && +key - 4 < S.oven.length) selectOven(+key - 4);
    else if (SPOT_KEYS.includes(key)) serve(SPOT_KEYS.indexOf(key));
    else if (key === 'Backspace' || key === 'Delete') dump();
    else {
      const st = Object.keys(KEYS).find(k => KEYS[k] === key);
      const pk = Object.keys(PKEYS).find(k => PKEYS[k] === key);
      const P = pastries();
      if (st && ING[st].day <= S.day) add(st);
      else if (pk && P[pk] && P[pk].day <= S.day && S.oven.length) bake(pk);
      else hit = false;
    }
    if (hit) e.preventDefault();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && S && S.running && !S.paused) pause(true); });

  /* ---------- Boot ---------- */
  SAVE = loadSave(); persist();
  applyTheme(SAVE.theme);
  renderDecor();
  // A live-looking bar behind the title card
  S = freshState(1);
  S.cups[0] = { base: 'hot', items: ['shot', 'milk'], busy: null };
  buildStations(); renderMenu(); renderCups(); renderOven(); renderHUD();
  title();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
