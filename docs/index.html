<title>Lox Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gochi+Hand&family=Shrikhand&display=swap">
<style>
  /* Single-theme on purpose: the café is its own bright little world.
     The café-theme tokens (wall, wood, awning, bar, board) are swapped by the
     in-game Themes shop via applyTheme(). */
  :root {
    --ink: #2B1A14;
    --wall: #BFE6D5;
    --wall-2: #A8DCC6;
    --tile: #F4FBF7;
    --wood: #B8683D;
    --wood-dk: #8C4A28;
    --wood-hi: #D48454;
    --awn: #F2545B;
    --awn2: #FFFDF7;
    --bar: #4A2A1A;
    --board: #2E463C;
    --espresso: #4A2A1A;
    --butter: #FFD66B;
    --cherry: #F2545B;
    --mint: #3FA37D;
    --paper: #FFFDF7;
    --chalk: #F3F1E6;
    --muted: #6B5A52;
    --display: "Shrikhand", "Cooper Black", Georgia, serif;
    --ui: "Fredoka", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
    --hand: "Gochi Hand", "Comic Sans MS", cursive;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--wall);
    background-image:
      linear-gradient(90deg, rgba(255,255,255,.18) 50%, transparent 50%),
      linear-gradient(rgba(255,255,255,.18) 50%, transparent 50%);
    background-size: 36px 36px;
    color: var(--ink);
    font-family: var(--ui);
    font-size: 15px;
    padding-inline: 16px;
    padding-block: 12px 24px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--cherry); outline-offset: 2px; }

  .game {
    max-width: 1080px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 250px;
    gap: 14px;
    position: relative;
  }
  @media (max-width: 820px) { .game { grid-template-columns: 1fr; } }

  /* HUD */
  .hud {
    grid-column: 1 / -1;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 8px 14px;
    box-shadow: 0 4px 0 var(--ink);
  }
  .logo { font-family: var(--display); font-size: 24px; line-height: 1; color: var(--cherry); -webkit-text-stroke: 1px var(--ink); margin-right: auto; }
  .logo small { font-family: var(--ui); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); -webkit-text-stroke: 0; margin-left: 6px; }
  .stat { display: flex; flex-direction: column; line-height: 1.1; }
  .stat .k, .task .k { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .goalbar { width: 120px; height: 8px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; overflow: hidden; margin-top: 3px; }
  .goalbar i, .taskbar i { display: block; height: 100%; width: 0; background: var(--mint); transition: width .3s; }
  .goalbar i.met { background: var(--butter); }
  #streak.hot .v { color: var(--cherry); }
  .iconbtn {
    border: 2.5px solid var(--ink); background: var(--butter); border-radius: 10px;
    padding: 4px 10px; font-weight: 600; font-size: 13px; box-shadow: 0 3px 0 var(--ink);
  }
  .iconbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

  /* Counter + customers */
  .main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .shop {
    position: relative;
    border: 3px solid var(--ink);
    border-radius: 18px;
    overflow: hidden;
    background: linear-gradient(var(--tile) 0 62%, var(--wall-2) 62%);
    box-shadow: 0 4px 0 var(--ink);
  }
  .shop::before { /* awning */
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 16px;
    background: repeating-linear-gradient(90deg, var(--awn) 0 22px, var(--awn2) 22px 44px);
    border-bottom: 3px solid var(--ink);
  }
  .rush {
    position: absolute; top: 24px; left: 50%; transform: translateX(-50%); z-index: 3;
    background: var(--cherry); color: #fff; border: 2.5px solid var(--ink); border-radius: 999px;
    padding: 2px 14px; font-weight: 700; font-size: 13px; letter-spacing: .04em; white-space: nowrap;
    animation: pulse .8s ease-in-out infinite alternate;
  }
  @keyframes pulse { to { transform: translateX(-50%) scale(1.08); } }
  .spots {
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 26px 6px 0; gap: 4px;
    position: relative; z-index: 1;
  }
  .spot { position: relative; height: 236px; }
  .counter {
    position: relative; z-index: 2;
    height: 46px; margin-top: -20px;
    background: var(--wood);
    border-top: 3px solid var(--ink);
    box-shadow: inset 0 8px 0 var(--wood-hi);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 16px 12px 0;
  }
  .pat { height: 10px; border: 2px solid var(--ink); border-radius: 6px; background: var(--wood-dk); overflow: hidden; opacity: 0; transition: opacity .2s; }
  .pat.on { opacity: 1; }
  .pat i { display: block; height: 100%; width: 100%; background: var(--mint); }
  .pat.meh i { background: var(--butter); }
  .pat.mad i { background: var(--cherry); }

  .cust {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    background: none; border: 0; padding: 0;
    animation: walkin .45s cubic-bezier(.2,.9,.3,1.3);
  }
  .cust.leaving { animation: walkout .45s ease-in forwards; pointer-events: none; }
  .cust.wrong .person { animation: shake .35s; }
  @keyframes walkin { from { transform: translateY(40px); opacity: 0; } }
  @keyframes walkout { to { transform: translateY(40px) scale(.9); opacity: 0; } }
  @keyframes shake { 25% { transform: translateX(-6px) rotate(-4deg); } 75% { transform: translateX(6px) rotate(4deg); } }

  .ticket {
    position: relative; margin-bottom: 8px;
    background: var(--paper); border: 2.5px solid var(--ink); border-radius: 12px;
    padding: 5px 7px; min-width: 84%; max-width: 100%;
    font-family: var(--hand); font-size: 17px; line-height: 1.05; text-align: center;
    box-shadow: 0 3px 0 var(--ink);
  }
  .ticket::after {
    content: ""; position: absolute; left: 50%; bottom: -9px; width: 12px; height: 12px;
    background: inherit; border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink);
    transform: translateX(-50%) rotate(45deg);
  }
  .cust:hover .ticket, .cust:focus-visible .ticket { background: #FFF6CF; }
  .cust.critic .ticket { background: #F1ECFF; }
  .who { display: block; font-family: var(--ui); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--cherry); margin-bottom: 2px; }
  .critic .who { color: #6A4BB5; }
  .part { display: block; }
  .part.p { font-size: 14px; margin-top: 3px; }
  .part.p.solo { font-size: 17px; margin-top: 0; }
  .part.done { opacity: .4; text-decoration: line-through; }
  .spc { color: var(--cherry); }
  .mods { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 3px; }
  .mod { font-family: var(--ui); font-size: 10px; font-weight: 700; background: var(--cherry); color: #fff; border-radius: 6px; padding: 1px 5px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin-top: 4px; }
  .chip { font-family: var(--ui); font-size: 10px; font-weight: 600; line-height: 1; padding: 2px 4px; border-radius: 5px; border: 1.5px solid var(--ink); background: var(--c); color: var(--t); }
  .nochips .chips { display: none; }
  .dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--c); display: inline-block; flex: none; }

  /* People */
  .person { position: relative; width: 60px; height: 84px; transform-origin: bottom center; }
  .person.kid { transform: scale(.78); }
  .hairback { position: absolute; left: 6px; top: 6px; width: 48px; height: 52px; border-radius: 24px 24px 10px 10px; background: var(--hair); border: 3px solid var(--ink); }
  .head { position: absolute; left: 9px; top: 10px; width: 42px; height: 42px; border-radius: 50%; background: var(--skin); border: 3px solid var(--ink); z-index: 1; }
  .cap { position: absolute; left: 8px; top: 6px; width: 44px; height: 20px; border-radius: 22px 22px 4px 4px; background: var(--hair); border: 3px solid var(--ink); z-index: 2; }
  .bun { position: absolute; left: 21px; top: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--hair); border: 3px solid var(--ink); }
  .beanie { position: absolute; left: 7px; top: 2px; width: 46px; height: 24px; border-radius: 23px 23px 4px 4px; border: 3px solid var(--ink); z-index: 2;
    background: repeating-linear-gradient(90deg, var(--shirt) 0 6px, rgba(255,255,255,.35) 6px 8px), var(--shirt); }
  .beanie::after { content: ""; position: absolute; left: 14px; top: -11px; width: 12px; height: 12px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); }
  .beret { position: absolute; left: 3px; top: 3px; width: 52px; height: 17px; border-radius: 50%; background: #3A2E5C; border: 3px solid var(--ink); z-index: 2; transform: rotate(-8deg); }
  .beret::after { content: ""; position: absolute; left: 22px; top: -8px; width: 4px; height: 7px; background: var(--ink); border-radius: 2px; }
  .phones { position: absolute; left: 4px; top: 4px; width: 52px; height: 32px; border: 4px solid #3D3D3D; border-bottom: 0; border-radius: 26px 26px 0 0; z-index: 3; }
  .phones::before, .phones::after { content: ""; position: absolute; bottom: -10px; width: 11px; height: 16px; border-radius: 5px; background: var(--cherry); border: 2.5px solid var(--ink); }
  .phones::before { left: -8px; } .phones::after { right: -8px; }
  .eye { position: absolute; top: 17px; width: 5px; height: 6px; border-radius: 50%; background: var(--ink); }
  .eye.l { left: 10px; } .eye.r { right: 10px; }
  .glasses { position: absolute; left: 2px; top: 12px; width: 32px; height: 13px; z-index: 1; background: linear-gradient(var(--ink), var(--ink)) center 4px / 8px 2.5px no-repeat; }
  .glasses::before, .glasses::after { content: ""; position: absolute; top: 0; width: 12px; height: 11px; border: 2.5px solid var(--ink); border-radius: 50%; }
  .glasses::before { left: 0; } .glasses::after { right: 0; }
  .glasses.shades::before, .glasses.shades::after { background: var(--ink); border-radius: 3px 3px 7px 7px; }
  .mouth { position: absolute; left: 13px; top: 25px; width: 10px; height: 5px; border-bottom: 3px solid var(--ink); border-radius: 0 0 10px 10px; transition: all .2s; }
  .meh .mouth { height: 3px; border-radius: 0; }
  .mad .mouth { top: 27px; border-bottom: 0; border-top: 3px solid var(--ink); border-radius: 10px 10px 0 0; }
  .mad .eye::before { content: ""; position: absolute; top: -5px; left: -2px; width: 8px; height: 3px; background: var(--ink); }
  .mad .eye.l::before { transform: rotate(25deg); } .mad .eye.r::before { transform: rotate(-25deg); }
  .blush { position: absolute; top: 24px; width: 7px; height: 4px; border-radius: 50%; background: #F58E8E; opacity: .7; }
  .blush.l { left: 3px; } .blush.r { right: 3px; }
  .body { position: absolute; left: 0; bottom: 0; width: 60px; height: 36px; border-radius: 26px 26px 6px 6px; background: var(--shirt); border: 3px solid var(--ink); }
  .scarf { position: absolute; left: 14px; top: -2px; width: 26px; height: 8px; border-radius: 4px; background: var(--butter); border: 2px solid var(--ink); }

  /* Pastries (drawn with CSS) */
  .pz { position: relative; width: 46px; height: 36px; display: inline-block; flex: none; vertical-align: middle; }
  .pz .b, .pz .d { position: absolute; border: 2.5px solid var(--ink); overflow: hidden; }
  .pz.croissant .b { left: 1px; right: 1px; bottom: 3px; height: 24px; border-radius: 50% 50% 45% 45% / 80% 80% 25% 25%; background: repeating-linear-gradient(90deg, #E7A64A 0 7px, #C9832E 7px 9px); }
  .pz.muffin .b { left: 9px; right: 9px; bottom: 1px; height: 15px; border-radius: 2px 2px 7px 7px; background: repeating-linear-gradient(90deg, #F7A1C4 0 4px, #fff 4px 7px); }
  .pz.muffin .d { left: 3px; right: 3px; top: 2px; height: 22px; border-radius: 50% 50% 25% 25% / 70% 70% 30% 30%; background: #C98D4E; }
  .pz.cookie .b { left: 6px; right: 6px; top: 1px; bottom: 1px; border-radius: 50%; background: #D9A066; }
  .pz.scone .b { left: 4px; right: 4px; bottom: 2px; height: 28px; border-radius: 45% 45% 10px 10px / 70% 70% 10px 10px; background: #E3B77A; }
  .pz .g { position: absolute; left: 8%; right: 8%; top: 1px; height: 50%; border-radius: 0 0 40% 40% / 0 0 80% 80%; background: var(--g); }
  .pz.cookie .g { left: 15%; right: 15%; top: 15%; height: 70%; border-radius: 50%; }
  .pz .tp { position: absolute; inset: 1px; }
  .tp.sprinkles { background: radial-gradient(circle at 22% 30%, #F2545B 0 1.8px, transparent 2.3px), radial-gradient(circle at 58% 22%, #5AA9E6 0 1.8px, transparent 2.3px), radial-gradient(circle at 78% 52%, #FFD66B 0 1.8px, transparent 2.3px), radial-gradient(circle at 38% 60%, #3FA37D 0 1.8px, transparent 2.3px), radial-gradient(circle at 66% 70%, #B58BE0 0 1.8px, transparent 2.3px); }
  .tp.berries { background: radial-gradient(circle at 25% 38%, #4B5BB5 0 3px, transparent 3.5px), radial-gradient(circle at 62% 28%, #3A3F8F 0 3px, transparent 3.5px), radial-gradient(circle at 78% 62%, #4B5BB5 0 3px, transparent 3.5px), radial-gradient(circle at 45% 66%, #3A3F8F 0 3px, transparent 3.5px); }
  .tp.nuts { background: radial-gradient(ellipse at 28% 35%, #8C5A2B 0 3px, transparent 3.5px), radial-gradient(ellipse at 66% 30%, #A9713A 0 3px, transparent 3.5px), radial-gradient(ellipse at 50% 64%, #8C5A2B 0 3px, transparent 3.5px); }
  .tp.chips { background: radial-gradient(circle at 30% 32%, #4A2A1A 0 2.6px, transparent 3px), radial-gradient(circle at 66% 26%, #4A2A1A 0 2.6px, transparent 3px), radial-gradient(circle at 72% 64%, #4A2A1A 0 2.6px, transparent 3px), radial-gradient(circle at 36% 70%, #4A2A1A 0 2.6px, transparent 3px); }
  .pz.cold { filter: saturate(.35) brightness(1.12); }
  .pz.burnt { filter: brightness(.3) saturate(.3); }
  .pz.mini { transform: scale(.72); margin: -5px -6px; }
  .pz.big { transform: scale(2.2); margin: 26px 40px; }

  /* Bar: cups, oven, dump */
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .cups { flex: 3 1 330px; display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 10px; min-width: 0; }
  .slot {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 16px;
    padding: 8px 10px; display: grid; grid-template-columns: 62px 1fr; gap: 8px; align-items: center;
    box-shadow: 0 4px 0 var(--ink); text-align: left; min-width: 0;
  }
  .slot.target { box-shadow: 0 4px 0 var(--ink), 0 0 0 3px var(--paper), 0 0 0 5px var(--butter); }
  .slot.active { background: #FFF3C2; box-shadow: 0 4px 0 var(--ink), 0 0 0 4px var(--butter); }
  .slot .meta { min-width: 0; }
  .slot .lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .slot .contents { font-size: 13px; font-weight: 500; line-height: 1.25; margin-top: 2px; overflow-wrap: break-word; }
  .cups[data-n="3"] .slot { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 6px; }
  .slot .prog { height: 7px; border: 2px solid var(--ink); border-radius: 5px; margin-top: 5px; overflow: hidden; background: #fff; display: block; }
  .slot .prog i { display: block; height: 100%; width: 0; background: var(--espresso); }
  .cupwrap { height: 76px; display: flex; align-items: flex-end; justify-content: center; }
  .cup { position: relative; width: 48px; height: 58px; border: 3px solid var(--ink); border-top-width: 0; overflow: hidden; display: flex; flex-direction: column-reverse; background: #fff; }
  .cup.hot { border-radius: 4px 4px 16px 16px; }
  .cup.iced { width: 44px; height: 68px; border-radius: 2px 2px 10px 10px; background: #E3F5FF; border-top: 3px solid var(--ink); }
  .cup.iced::after { content: ""; position: absolute; inset: 14px 10px auto; height: 26px; background:
      linear-gradient(135deg, rgba(255,255,255,.9) 0 40%, transparent 40%) 0 0/12px 12px; opacity: .8; pointer-events: none; }
  .cupholder { position: relative; }
  .cupholder.hot::after { content: ""; position: absolute; right: -13px; top: 12px; width: 12px; height: 22px; border: 3px solid var(--ink); border-left: 0; border-radius: 0 12px 12px 0; }
  .layer { display: block; width: 100%; flex: 0 0 auto; height: 13%; background: var(--c); }
  .layer.top { height: 16%; border-radius: 12px 12px 0 0; box-shadow: inset 0 -2px 0 rgba(0,0,0,.08); }
  .emptycup { width: 48px; height: 58px; border: 3px dashed #BDAEA5; border-radius: 6px 6px 16px 16px; display: grid; place-items: center; font-size: 11px; color: var(--muted); text-align: center; line-height: 1.1; }

  .oven { flex: 1 1 190px; background: #3B2E2A; border: 3px solid var(--ink); border-radius: 16px; padding: 6px 8px 8px; box-shadow: 0 4px 0 var(--ink); display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .oven[hidden] { display: none; }
  .ovlabel, .case .cl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #F3E3D6; }
  .ovslots { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 6px; flex: 1; }
  .ovslot { border: 2.5px solid var(--ink); border-radius: 10px; background: radial-gradient(circle at 50% 75%, #5a3a2a, #241612 75%); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; padding: 6px 4px 5px; min-height: 86px; color: #F3E3D6; font-size: 11px; font-weight: 600; }
  .ovslot.warm { background: radial-gradient(circle at 50% 78%, #F59E3B, #5a2a12 72%); }
  .ovslot.ready { background: radial-gradient(circle at 50% 78%, #FFE08A, #8a5a1a 72%); color: var(--ink); }
  .ovslot.burnt { background: #1c110d; color: #F58E8E; }
  .ovslot.active { box-shadow: 0 0 0 4px var(--butter); }
  .ovslot .obar { width: 90%; height: 6px; border: 1.5px solid var(--ink); border-radius: 4px; background: #fff; overflow: hidden; display: block; }
  .ovslot .obar i { display: block; height: 100%; width: 0; background: var(--mint); }
  .ovslot.ready .obar i { background: var(--cherry); }

  .trash {
    flex: 0 0 auto;
    border: 3px solid var(--ink); border-radius: 16px; background: #fff; box-shadow: 0 4px 0 var(--ink);
    padding: 8px 14px; font-weight: 600; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; line-height: 1.1;
  }
  .trash small { font-size: 10px; color: var(--muted); font-weight: 500; }
  .trash .bin { width: 26px; height: 30px; border: 3px solid var(--ink); border-radius: 3px 3px 7px 7px; background: repeating-linear-gradient(90deg, #ddd 0 4px, #fff 4px 8px); position: relative; margin-top: 6px; }
  .trash .bin::before { content: ""; position: absolute; left: -6px; right: -6px; top: -8px; height: 5px; border: 3px solid var(--ink); border-radius: 4px; background: #fff; }
  .trash:active, .station:active:not(:disabled), .slot:active, .ovslot:active { transform: translateY(2px); }

  /* Stations */
  .stations {
    background: var(--bar); border: 3px solid var(--ink); border-radius: 18px; padding: 10px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px;
    box-shadow: 0 4px 0 var(--ink);
  }
  .stations.case { background: var(--wood-dk); }
  .stations[hidden] { display: none; }
  .case .cl { grid-column: 1 / -1; }
  .station {
    position: relative; overflow: hidden;
    border: 2.5px solid var(--ink); border-radius: 12px; background: var(--paper);
    padding: 7px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 13px; font-weight: 600; line-height: 1.1; box-shadow: 0 3px 0 rgba(0,0,0,.45); text-align: center;
  }
  .station .ic { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--c); }
  .station .ic.sq { border-radius: 5px 5px 10px 10px; }
  .station .t { font-size: 10px; font-weight: 500; color: var(--muted); }
  .station:disabled { background: #6E5448; color: #C8B2A6; box-shadow: none; cursor: not-allowed; border-color: #3a241a; }
  .station:disabled .ic, .station:disabled .pz { opacity: .3; }
  .station:disabled .t { color: #C8B2A6; }
  .station .busy { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--cherry); }
  .station.cupbtn { background: #E8F7F0; }
  .station.sig { background: #FFF3C2; }
  .hint { min-height: 28px; display: flex; justify-content: center; align-items: center; }
  .hint:not(:empty) { font-size: 14px; font-weight: 600; color: var(--cherry); background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 14px; width: fit-content; margin: 0 auto; }

  @media (max-width: 520px) {
    .cups { flex-basis: 100%; }
    .slot { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 6px; }
    .trash { flex: 1 1 100%; flex-direction: row; padding: 6px; }
    .trash .bin { margin-top: 4px; }
    .spot { height: 226px; }
    .ticket { font-size: 14px; padding: 4px 4px; }
    .part.p.solo { font-size: 14px; }
    .person { transform: scale(.85); }
    .person.kid { transform: scale(.66); }
  }

  /* Side: challenge + menu board */
  .side { display: flex; flex-direction: column; gap: 14px; }
  .task { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; padding: 10px 12px; box-shadow: 0 4px 0 var(--ink); display: grid; gap: 5px; }
  .task[hidden] { display: none; }
  .task.done { background: #E8F7F0; }
  .task .tt { font-weight: 600; line-height: 1.25; }
  .task .rw { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
  .taskbar { height: 8px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; overflow: hidden; }
  .boardwrap { position: relative; padding-top: 4px; }
  .board {
    background: var(--board); color: var(--chalk);
    border: 8px solid var(--wood); outline: 3px solid var(--ink); border-radius: 6px;
    padding: 12px 14px 14px; font-family: var(--hand);
    box-shadow: 0 6px 0 var(--ink);
  }
  .board h2 { margin: 0 0 6px; font-size: 26px; font-weight: 400; text-align: center; letter-spacing: .02em; }
  .board h3 { margin: 12px 0 4px; font-size: 19px; font-weight: 400; text-align: center; opacity: .9; }
  .board ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  .board li { display: grid; gap: 1px; }
  .board .row { display: flex; justify-content: space-between; gap: 6px; font-size: 19px; line-height: 1; }
  .board .price { font-variant-numeric: tabular-nums; }
  .board .rec { font-size: 14px; opacity: .8; }
  .board .new { color: var(--butter); font-size: 13px; margin-left: 4px; }
  .board .foot { margin-top: 10px; padding-top: 8px; border-top: 1.5px dashed rgba(243,241,230,.4); font-size: 14px; opacity: .85; line-height: 1.2; }

  /* Floaters */
  .floater { position: absolute; z-index: 20; pointer-events: none; font-weight: 700; font-size: 20px; color: var(--mint); -webkit-text-stroke: .6px var(--ink); animation: floatup 1.1s ease-out forwards; white-space: nowrap; transform: translateX(-50%); }
  .floater.bad { color: var(--cherry); font-size: 16px; }
  .floater.combo { color: var(--butter); font-size: 15px; }
  @keyframes floatup { to { transform: translate(-50%, -54px); opacity: 0; } }

  /* Overlay cards */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(43,26,20,.45);
    -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
    display: grid; place-items: center; padding: 16px;
  }
  .overlay[hidden] { display: none; }
  .coach { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
  .coach[hidden] { display: none; }
  .ring { position: fixed; border-radius: 14px; pointer-events: none; transition: all .25s ease;
    box-shadow: 0 0 0 4px var(--butter), 0 0 0 9px rgba(255,214,107,.35), 0 0 0 9999px rgba(20,12,8,.62); animation: ringpulse 1.1s ease-in-out infinite alternate; }
  @keyframes ringpulse { to { box-shadow: 0 0 0 4px var(--butter), 0 0 0 14px rgba(255,214,107,.2), 0 0 0 9999px rgba(20,12,8,.62); } }
  .bubble { position: fixed; pointer-events: auto; width: min(320px, calc(100vw - 32px)); background: var(--paper); border: 3px solid var(--ink); border-radius: 16px;
    box-shadow: 0 5px 0 var(--ink); padding: 12px 14px 12px; font-size: 15px; line-height: 1.4; text-align: left; transition: top .25s ease, left .25s ease; }
  .bubble .tstep { display: block; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .bubble .btnrow { justify-content: flex-start; align-items: center; margin-top: 10px; }
  .bubble .big { font-size: 15px; padding: 6px 16px; box-shadow: 0 3px 0 var(--ink); }
  .bubble .big[hidden] { display: none; }
  .tskip { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 4px; margin-left: auto; }
  @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
  @media (min-width: 601px) {
    .overlay { background: rgba(28,17,11,.72); -webkit-backdrop-filter: blur(14px) saturate(.8); backdrop-filter: blur(14px) saturate(.8); }
  }
  .card {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink);
    width: min(460px, 100%); padding: 22px 22px 20px; text-align: center; max-height: 100%; overflow: auto;
  }
  .card.wide { width: min(660px, 100%); }
  .card h1 { font-family: var(--display); font-weight: 400; font-size: 46px; line-height: 1; margin: 0; color: var(--cherry); -webkit-text-stroke: 1.5px var(--ink); text-wrap: balance; }
  .card h2 { font-family: var(--display); font-weight: 400; font-size: 32px; margin: 0 0 6px; color: var(--espresso); text-wrap: balance; }
  .card .ver { display: inline-block; margin: 10px 0 10px; background: var(--butter); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 12px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .card ol { text-align: left; margin: 0 0 16px; padding-left: 22px; line-height: 1.45; }
  .card ol li { margin-bottom: 4px; }
  .card p { margin: 0 0 12px; line-height: 1.4; }
  .bank { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .big {
    border: 3px solid var(--ink); background: var(--mint); color: #fff; font-weight: 700; font-size: 20px;
    border-radius: 14px; padding: 10px 26px; box-shadow: 0 5px 0 var(--ink); -webkit-text-stroke: .4px var(--ink);
  }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  .big.alt { background: #fff; color: var(--ink); -webkit-text-stroke: 0; font-size: 16px; }
  .big:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .stars { font-size: 40px; letter-spacing: 6px; margin: 4px 0 8px; color: #D9CFC8; }
  .stars b { color: var(--butter); -webkit-text-stroke: 1.5px var(--ink); font-weight: 400; }
  .results { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; text-align: left; margin: 8px 0 14px; font-size: 15px; }
  .results span:nth-child(even) { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .small { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.4; }
  .card .btnrow + .small { margin-top: 22px; margin-bottom: 0; }

  /* Chalkboard card (day-start menu), matching the menu board */
  .card.chalk { background: var(--board); color: var(--chalk); border: 10px solid var(--wood); outline: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 8px 0 var(--ink); }
  .card.chalk h2 { font-family: var(--hand); font-weight: 400; font-size: 40px; color: var(--chalk); letter-spacing: .02em; }
  .card.chalk p { color: var(--chalk); }
  .card.chalk b { color: var(--butter); }
  .card.chalk .small, .card.chalk .dpnote { color: rgba(243,241,230,.75); }
  .card.chalk .unlock { background: rgba(243,241,230,.07); border: 2px dashed rgba(243,241,230,.45); color: var(--chalk); }
  .card.chalk .unlock.goal { border-color: rgba(255,214,107,.7); }
  .card.chalk .recipes li { border: 1.5px solid rgba(243,241,230,.22); }
  .card.chalk .recipes li.isnew { background: rgba(255,214,107,.13); border: 2px solid var(--butter); }
  .card.chalk .rname { font-family: var(--hand); font-weight: 400; font-size: 21px; color: var(--chalk); }
  .card.chalk .rsteps { color: rgba(243,241,230,.8); }
  .card.chalk .rstep + .rstep::before { color: rgba(243,241,230,.4); }
  .card.chalk .dot { border-color: rgba(243,241,230,.8); }
  .card.chalk .fullmenu summary { color: var(--chalk); }
  .card.chalk .spc { color: #FF9AA0; }
  .card.chalk .diffpick { border-color: var(--ink); }
  .card.chalk .dp { color: var(--ink); }
  .card.chalk .fullmenu { margin-top: 4px; }
  .recipes { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 6px; text-align: left; }
  .recipes li { border: 2px solid #E6DCD4; border-radius: 12px; padding: 7px 10px; display: grid; gap: 4px; }
  .recipes li.isnew { background: #FFF3C2; border-color: var(--ink); }
  .recipes li.rmod { border-style: dashed; font-size: 13px; }
  .rname { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .newtag { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; background: var(--cherry); color: #fff; border-radius: 6px; padding: 1px 6px; }
  .newtag.sig { background: #6A4BB5; }
  .rsteps { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); }
  .rstep { display: inline-flex; align-items: center; gap: 4px; }
  .rstep + .rstep::before { content: "+"; margin-right: 6px; color: #BDAEA5; }
  .unlock { background: #E8F7F0; border: 2px dashed var(--mint); border-radius: 12px; padding: 8px 10px; margin-bottom: 12px; font-size: 14px; text-align: left; line-height: 1.35; }
  .unlock.goal { background: #FFF3C2; border-color: #D9A93A; }
  .fullmenu { text-align: left; margin-bottom: 14px; }
  .fullmenu summary { cursor: pointer; font-weight: 600; margin-bottom: 8px; }

  /* Shop */
  .shopsec h3 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; margin: 14px 0 6px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: left; border: 2px solid #E6DCD4; border-radius: 12px; padding: 8px 10px; margin-bottom: 6px; }
  .item .nm { font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item .ds { font-size: 13px; color: var(--muted); line-height: 1.3; }
  .buy { grid-row: 1 / span 2; grid-column: 2; border: 2.5px solid var(--ink); border-radius: 10px; background: var(--butter); font-weight: 700; padding: 6px 12px; box-shadow: 0 3px 0 var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .buy:disabled { background: #EEE6E0; color: #9C8D85; box-shadow: none; cursor: not-allowed; border-color: #CDBFB6; }
  .buy.owned { background: #E8F7F0; }
  .buy.owned:disabled { color: var(--mint); border-color: var(--mint); }
  .swatch { display: inline-flex; gap: 3px; }
  .swatch i { width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid var(--ink); background: var(--c); }

  /* Signature makers */
  .field { text-align: left; margin-bottom: 10px; }
  .field label, .plabel { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; text-align: left; }
  .field input { font: inherit; font-size: 16px; border: 2.5px solid var(--ink); border-radius: 10px; padding: 7px 10px; width: 100%; background: #fff; user-select: text; }
  .field input:focus-visible { outline: 3px solid var(--butter); }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .pick { border: 2px solid var(--ink); border-radius: 10px; background: #fff; padding: 4px 9px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
  .pick.on { background: var(--butter); }
  .pick:disabled { opacity: .4; cursor: not-allowed; }
  .pick.static { cursor: default; }
  .preview { display: flex; justify-content: center; margin: 4px 0 8px; }


  /* Decor (bought in the shop, drawn into the café) */
  .lights { position: absolute; left: 0; right: 0; top: 17px; height: 14px; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 6px 9px, #FFD66B 0 3.5px, transparent 4px) 0 0 / 24px 14px repeat-x,
      radial-gradient(circle at 18px 9px, #F7A1C4 0 3.5px, transparent 4px) 0 0 / 24px 14px repeat-x,
      linear-gradient(var(--ink), var(--ink)) 0 4px / 100% 1.5px no-repeat; }
  .lights[hidden] { display: none; }
  .decor { position: absolute; left: 0; right: 0; top: 30px; height: 34px; z-index: 0; pointer-events: none;
    display: flex; justify-content: space-around; align-items: flex-end; padding-inline: 10px; }
  .dc { position: relative; display: inline-block; flex: none; }
  .dc.plant { width: 24px; height: 30px; }
  .dc.plant::before { content: ""; position: absolute; left: 5px; bottom: 0; width: 14px; height: 11px; background: #C2643A; border: 2px solid var(--ink); border-radius: 1px 1px 5px 5px; }
  .dc.plant::after { content: ""; position: absolute; left: 0; top: 0; width: 20px; height: 18px; border: 2px solid var(--ink); border-radius: 50% 50% 40% 40%;
    background: radial-gradient(circle at 30% 40%, #5FC29A 0 4px, transparent 4.5px), #3FA37D; }
  .dc.clock { width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid var(--ink);
    background: linear-gradient(var(--ink), var(--ink)) 9px 4px / 2px 7px no-repeat, linear-gradient(var(--ink), var(--ink)) 10px 9px / 6px 2px no-repeat, #fff; }
  .dc.shelf { width: 42px; height: 22px;
    background: linear-gradient(#F2545B, #F2545B) 3px 5px / 9px 10px no-repeat, linear-gradient(#5AA9E6, #5AA9E6) 16px 5px / 9px 10px no-repeat, linear-gradient(#FFD66B, #FFD66B) 29px 5px / 9px 10px no-repeat; }
  .dc.shelf::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--wood); border: 2px solid var(--ink); border-radius: 2px; }
  .dc.records { width: 32px; height: 24px; }
  .dc.records::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 11px; background: #8C4A28; border: 2px solid var(--ink); border-radius: 3px; }
  .dc.records::after { content: ""; position: absolute; left: 4px; bottom: 7px; width: 22px; height: 9px; border-radius: 50%; background: radial-gradient(circle, #F2545B 0 2px, #222 2.5px); border: 2px solid var(--ink); }
  .dc.art { width: 34px; height: 26px; border: 3px solid var(--wood); outline: 2px solid var(--ink);
    background: linear-gradient(135deg, #2A4D73 0 45%, #DDE35F 45% 58%, #6EBFEA 58%); }
  .dc.sign { font-family: var(--display); font-size: 13px; line-height: 1; color: #FF8AC8; background: #2B1A14; border: 2px solid #FF8AC8; border-radius: 6px; padding: 2px 5px 3px;
    text-shadow: 0 0 6px #FF8AC8; box-shadow: 0 0 8px rgba(255,138,200,.6); }
  .dc.cat { width: 26px; height: 20px; }
  .dc.cat::before { content: ""; position: absolute; left: 1px; bottom: 0; width: 22px; height: 16px; border-radius: 50% 50% 45% 45%; background: #E0A33A; border: 2px solid var(--ink);
    box-shadow: inset 5px -3px 0 #F3C46B; }
  .dc.cat::after { content: ""; position: absolute; left: 3px; top: 0; width: 18px; height: 8px;
    background: linear-gradient(135deg, transparent 50%, var(--ink) 50%) 0 0 / 7px 8px no-repeat, linear-gradient(225deg, transparent 50%, var(--ink) 50%) 11px 0 / 7px 8px no-repeat; }
  .dprev { display: inline-flex; align-items: flex-end; height: 30px; }
  .dprev .dc.lightsicon { width: 40px; height: 14px; background: radial-gradient(circle at 6px 9px, #FFD66B 0 3.5px, transparent 4px) 0 0 / 14px 14px repeat-x, linear-gradient(var(--ink), var(--ink)) 0 4px / 100% 1.5px no-repeat; }

  /* Upgrade level pips + sticker book */
  .pips { display: inline-flex; gap: 3px; }
  .pips i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; }
  .pips i.on { background: var(--mint); }
  .shopnote { background: #FFF3C2; border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px; margin-bottom: 10px; font-weight: 600; }
  .stickers { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; text-align: left; }
  .stk { border: 2px dashed #D9CFC8; border-radius: 14px; padding: 8px 10px; display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
  .stk b { color: var(--ink); font-size: 14px; }
  .stk .badge { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; border: 2.5px solid #D9CFC8; background: #F3EEEA; color: #CDBFB6; margin-bottom: 2px; }
  .stk.have { border: 2.5px solid var(--ink); background: #fff; }
  .stk.have .badge { background: var(--c); color: #fff; border-color: var(--ink); -webkit-text-stroke: .5px var(--ink); transform: rotate(-8deg); }
  .stk .sp { font-size: 12px; font-variant-numeric: tabular-nums; }
  .hint.good:not(:empty) { color: var(--mint); }
  .stat .k { white-space: nowrap; }
  .diffpick { display: inline-flex; border: 2.5px solid var(--ink); border-radius: 12px; overflow: hidden; margin: 2px 0 4px; box-shadow: 0 3px 0 var(--ink); }
  .dp { border: 0; background: #fff; padding: 6px 14px; font-weight: 700; font-size: 14px; }
  .dp + .dp { border-left: 2.5px solid var(--ink); }
  .dp.on { background: var(--butter); }
  .dpnote { margin: 4px 0 12px !important; }
  .kbd { display: none; position: absolute; top: 3px; right: 4px; font: 700 9px/1.3 var(--ui); color: var(--muted); border: 1.5px solid #CDBFB6; border-radius: 4px; padding: 0 3px; text-transform: uppercase; background: rgba(255,255,255,.8); pointer-events: none; }
  .ovslot, .trash { position: relative; }
  .desk { display: none; }
  @media (hover: hover) and (pointer: fine) and (min-width: 601px) {
    .kbd, .desk { display: inline-block; }
    .spot::after { content: attr(data-key); position: absolute; left: 4px; bottom: 50px; font: 700 10px/1.3 var(--ui); color: var(--muted); border: 1.5px solid #CDBFB6; border-radius: 4px; padding: 0 4px; background: rgba(255,255,255,.85); z-index: 2; }
  }
  .kgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px 18px; text-align: left; margin-bottom: 14px; }
  .kgrid h3 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
  .krow { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 5px; }
  .kcap { min-width: 26px; text-align: center; font-weight: 700; font-size: 12px; border: 2px solid var(--ink); border-bottom-width: 3.5px; border-radius: 6px; padding: 1px 6px; background: #fff; white-space: nowrap; }
  .titlelogo { display: block; width: 120px; height: 120px; margin: -8px auto 2px; }
  @media (max-width: 600px) { .titlelogo { width: 92px; height: 92px; } }
  .field textarea.code { font: 12px/1.35 ui-monospace, Menlo, monospace; width: 100%; border: 2.5px solid var(--ink); border-radius: 10px; padding: 7px 9px; background: #fff; resize: vertical; user-select: text; -webkit-user-select: text; word-break: break-all; }
  .field textarea#pasteCode { font-size: 16px; }
  .codemsg { color: var(--cherry); font-weight: 600; }

  /* Phone layout: one screen, no scrolling while you play */
  .dumpbtn { display: none; }
  .lbl-m { display: none; }
  .pad { display: flex; flex-direction: column; gap: 14px; }
  @media (max-width: 600px) {
    body { padding-block: 6px; }
    .game { height: 100%; display: flex; flex-direction: column; gap: 6px; }
    .side { display: none; }
    .hud { flex-wrap: nowrap; gap: 8px; padding: 5px 8px; border-radius: 12px; box-shadow: 0 3px 0 var(--ink); }
    .logo, #soundBtn, #hintsBtn { display: none; }
    .stat .k { font-size: 8.5px; letter-spacing: .06em; }
    .stat .v { font-size: 16px; }
    .goalbar { width: 62px; height: 6px; }
    #menuBtn { margin-left: auto; }
    .iconbtn { padding: 5px 8px; font-size: 12px; box-shadow: 0 2px 0 var(--ink); }
    .main { flex: 1; min-height: 0; gap: 6px; }
    .shop { flex: 1; min-height: 150px; display: flex; flex-direction: column; border-radius: 14px; box-shadow: 0 3px 0 var(--ink); }
    .spots { flex: 1; min-height: 0; padding: 18px 2px 0; gap: 2px; }
    .spot { height: auto; }
    .counter { flex: none; height: 26px; margin-top: -12px; padding: 9px 6px 0; box-shadow: inset 0 5px 0 var(--wood-hi); }
    .pat { height: 7px; border-width: 1.5px; }
    .ticket { font-size: 12.5px; padding: 3px 4px; min-width: 0; width: 100%; border-width: 2px; border-radius: 9px; margin-bottom: 7px; box-shadow: 0 2px 0 var(--ink); }
    .ticket::after { width: 9px; height: 9px; bottom: -6px; border-width: 2px; }
    .part.p, .part.p.solo { font-size: 12px; }
    .who { font-size: 8px; letter-spacing: .03em; }
    .chips { gap: 1px; margin-top: 2px; }
    .chip { font-size: 8.5px; padding: 1px 2px; border-width: 1px; border-radius: 4px; }
    .mod { font-size: 8.5px; padding: 0 3px; }
    .person, .person.kid { transform: none; zoom: .8; }
    .person.kid { zoom: .62; }
    .decor { top: 22px; height: 26px; zoom: .8; }
    .lights { top: 16px; }
    .rush { top: 20px; font-size: 11px; padding: 1px 10px; }

    .bar { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; }
    .cups, .oven { display: contents; }
    .ovlabel, .bar > .trash { display: none; }
    .slot, .cups[data-n="3"] .slot { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 3px 2px 4px; gap: 0; border-width: 2.5px; border-radius: 12px; box-shadow: 0 3px 0 var(--ink); }
    .slot .contents { display: none !important; }
    .slot .lbl { font-size: 9px; letter-spacing: .04em; }
    .cupwrap { height: 50px; }
    .cupwrap > * { zoom: .7; }
    .slot .prog { width: 90%; height: 5px; margin-top: 2px; border-width: 1.5px; }
    .ovslot { min-height: 0; padding: 3px 2px 4px; font-size: 9px; gap: 1px; border-radius: 12px; }
    .ovslot .pz { zoom: .85; }

    .hint { position: fixed; left: 50%; top: 38%; transform: translateX(-50%); z-index: 30; pointer-events: none; min-height: 0; white-space: nowrap; box-shadow: 0 3px 0 var(--ink); }
    .hint:empty { display: none; }

    .pad { flex: none; display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; padding: 5px; background: var(--bar); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink); }
    .pad > .stations:not([hidden]) { display: contents; }
    .case .station:not(:disabled) { background: #FBEBD9; }
    .station { padding: 5px 0 4px; font-size: min(10.5px, 2.65vw); letter-spacing: -.01em; white-space: nowrap; gap: 3px; border-width: 2px; border-radius: 9px; min-height: 46px; box-shadow: 0 2px 0 rgba(0,0,0,.45); }
    .station .ic { width: 20px; height: 20px; border-width: 2px; }
    .station .t, .case .cl { display: none; }
    .station:disabled { display: none; }
    .station .pz.mini { transform: none; zoom: .55; margin: 0; }
    .lbl-f { display: none; }
    .lbl-m { display: inline; }
    .dumpbtn { display: flex; }
    .ic.dumpic { border-radius: 3px 3px 7px 7px; background: repeating-linear-gradient(90deg, #ddd 0 3px, #fff 3px 6px); }
    .card { padding: 18px 14px 16px; }
    .card h1 { font-size: 40px; }
    .card h2 { font-size: 27px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cust, .cust.leaving, .cust.wrong .person, .floater, .rush { animation-duration: .01s; }
  }
</style>

</head>
<body>
<div class="game" id="game">
  <header class="hud">
    <div class="logo">Lox Café<small>V1.6 · Behind the Bar</small></div>
    <div class="stat"><span class="k">Day</span><span class="v" id="day">1</span></div>
    <div class="stat"><span class="k"><span class="lbl-f">Shift left</span><span class="lbl-m">Time</span></span><span class="v" id="clock">1:30</span></div>
    <div class="stat"><span class="k"><span class="lbl-f">Tips today</span><span class="lbl-m">Tips</span></span><span class="v" id="money">$0.00</span><span class="goalbar"><i id="goalfill"></i></span></div>
    <div class="stat" id="streak"><span class="k">Combo</span><span class="v" id="streakv">×0</span></div>
    <button class="iconbtn" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
    <button class="iconbtn" id="hintsBtn" type="button" aria-pressed="false">Hints: new drinks</button>
    <button class="iconbtn" id="menuBtn" type="button">Menu</button>
    <button class="iconbtn" id="pauseBtn" type="button">Pause</button>
  </header>

  <div class="main">
    <section class="shop" aria-label="Counter">
      <div class="lights" id="lights" hidden></div>
      <div class="decor" id="decor"></div>
      <div class="rush" id="rush" hidden>Rush hour! Everything pays 25% more</div>
      <div class="spots" id="spots">
        <div class="spot" data-key="A"></div><div class="spot" data-key="S"></div><div class="spot" data-key="D"></div><div class="spot" data-key="F"></div>
      </div>
      <div class="counter" id="pats">
        <div class="pat"><i></i></div><div class="pat"><i></i></div><div class="pat"><i></i></div><div class="pat"><i></i></div>
      </div>
    </section>

    <section class="bar" aria-label="Your cups and oven">
      <div class="cups" id="cups"></div>
      <div class="oven" id="oven" hidden><span class="ovlabel">Oven</span><div class="ovslots" id="ovslots"></div></div>
      <button class="trash" id="trash" type="button"><span class="bin"></span><span>Dump<br><small>selected</small></span><span class="kbd">⌫</span></button>
    </section>
    <div class="hint" id="hint" role="status"></div>

    <div class="pad">
      <section class="stations" id="stations" aria-label="Drink stations"></section>
      <section class="stations case" id="case" aria-label="Pastry case" hidden></section>
    </div>
  </div>

  <aside class="side">
    <div class="task" id="task" hidden>
      <span class="k">Today's challenge</span>
      <span class="tt" id="taskText"></span>
      <span class="taskbar"><i id="taskFill"></i></span>
      <span class="rw"><span id="taskProg"></span><span id="taskReward"></span></span>
    </div>
    <div class="boardwrap">
      <div class="board">
        <h2>Today's Menu</h2>
        <ul id="menu"></ul>
        <div id="pastryBoard"></div>
        <div class="foot" id="boardfoot">Build it, then tap the customer to hand it over.</div>
      </div>
    </div>
  </aside>
</div>

<div class="coach" id="coach" hidden>
  <div class="ring" id="ring"></div>
  <div class="bubble" id="bubble" role="dialog" aria-live="polite" aria-label="Tutorial">
    <span class="tstep" id="tutStep"></span>
    <div id="bubbleText"></div>
    <div class="btnrow"><button class="big" id="tutNext" type="button">Next</button><button class="tskip" id="tutSkip" type="button">Skip tutorial</button></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card" id="card"></div>
</div>

    if (!soundOn || !actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.linearRampToValueAtTime(f + slide, actx.currentTime + d);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  }
